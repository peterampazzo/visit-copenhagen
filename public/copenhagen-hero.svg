<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" preserveAspectRatio="xMidYMid slice">
  <style>
    .water-line {
      fill: none;
      stroke: #aee0db;
      stroke-linecap: round;
      stroke-width: 3;
      stroke-dasharray: 48 28;
      animation: water-flow 8s linear infinite;
    }
    .water-line--far {
      stroke-width: 2;
      stroke-dasharray: 28 22;
      opacity: 0.66;
      animation-direction: reverse;
      animation-duration: 11s;
    }
    .cyclist-run {
      animation: cycle-across 19s linear infinite;
    }
    .bike-wheel {
      animation: wheel-turn 1.1s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .boat-run {
      animation: boat-across 27s linear 4s infinite;
    }
    .swan-run {
      animation: swan-across 34s linear 11s infinite;
    }
    .boat-bob,
    .swan-bob {
      animation: floating 2.8s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .swan-bob {
      animation-duration: 3.5s;
    }
    .danish-flag {
      animation: flag-fly 2.7s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: left center;
    }
    @keyframes water-flow {
      to {
        stroke-dashoffset: -152;
      }
    }
    @keyframes cycle-across {
      0%,
      10% {
        transform: translateX(440px);
        opacity: 0;
      }
      12% {
        opacity: 1;
      }
      66% {
        transform: translateX(1260px);
        opacity: 1;
      }
      67%,
      100% {
        transform: translateX(1260px);
        opacity: 0;
      }
    }
    @keyframes wheel-turn {
      to {
        transform: rotate(1turn);
      }
    }
    @keyframes boat-across {
      0%,
      18% {
        transform: translateX(1270px);
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      78% {
        transform: translateX(430px);
        opacity: 1;
      }
      80%,
      100% {
        transform: translateX(430px);
        opacity: 0;
      }
    }
    @keyframes swan-across {
      0%,
      24% {
        transform: translateX(420px);
        opacity: 0;
      }
      26% {
        opacity: 1;
      }
      78% {
        transform: translateX(1230px);
        opacity: 1;
      }
      80%,
      100% {
        transform: translateX(1230px);
        opacity: 0;
      }
    }
    @keyframes floating {
      50% {
        transform: translateY(2px) rotate(-0.5deg);
      }
    }
    @keyframes flag-fly {
      50% {
        transform: scaleX(0.93) skewY(-2deg);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
      .cyclist-run {
        transform: translateX(690px);
        opacity: 1;
      }
      .boat-run {
        transform: translateX(1030px);
        opacity: 1;
      }
      .swan-run {
        transform: translateX(560px);
        opacity: 1;
      }
    }
  </style>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3e9895" />
      <stop offset="1" stop-color="#176369" />
    </linearGradient>
