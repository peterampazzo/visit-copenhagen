sections:
  know:
    emoji: 🧯
    title: Things to know
    blurb: The small stuff that makes a big difference.
    groups:
      transport:
        title: Public transport
        items:
          metro:
            name: The Metro runs 24/7 — driverless
            note: Copenhagen's automated Metro has no driver and is operated and maintained by Metro Service, now owned by Milan's ATM Group.
            kicker: Driverless · with an Italian connection
            story: >-
              No driver means no Metro driver can go on strike—there is no
              driver. The people who monitor, maintain and assist the system are
              very real, of course. Since late 2025, Metro Service has been fully
              owned by Milan's public transport group ATM; Hitachi remains the
              main contractor for M3 and M4 until its contract ends.
            url: https://www.metroservice.dk/media/5m5pwgyl/metroservice-annual-report-2025.pdf
          paperTickets:
            name: Paper tickets need no validation
            note: They're time-stamped when you buy them, so just hop on. One ticket works for metro, bus, train and the waterbus.
          cityPass:
            name: City Pass Small
            note: Unlimited travel only in zones 1–4—central Copenhagen plus the airport. It does not cover all of Zealand.
            url: https://www.publictransport.dk/tickets/citypass
          copenhagenCard:
            name: Copenhagen Card
            note: Better value if you plan to visit several museums — transport and admissions included.
            url: https://copenhagencard.com
          waterbus:
            name: Waterbus
            note: Your normal transport ticket covers it. It crosses the harbour, roughly every half hour — check Citymapper for times.
          sTrainBike:
            name: The red S-trains take bikes for free
            note: They are Copenhagen's suburban network, separate from regional and InterCity trains. Bikes are free on S-trains; other train types have different rules.
            url: https://www.dsb.dk/s-tog/
      cycling:
        title: Cycling
        items:
          lights:
            name: Lights are mandatory after sunset
            note: Use two lights—a white or yellow one in front and a red one behind—from sunset to sunrise and whenever visibility is poor.
          stopping:
            name: Always raise your arm before stopping
            note: Raise one arm before stopping, point the other towards your turn, and keep right so faster riders can pass.
          cyclingGuide:
            name: How to cycle in Denmark
            note: Two minutes of reading that saves you a lot of angry bell-ringing.
            url: https://politi.dk/-/media/mediefiler/kbh/billeder-diverse/how-to-cycle-in-denmark-(1).pdf
      everyday:
        title: Everyday life
        items:
          deposit:
            name: Don't bin bottles and cans
            note: They carry a deposit — return them at any supermarket and get money back.
            url: https://danskretursystem.dk/en/about-deposits/
          payments:
            name: Payments
            note: We use Danish kroner, not euros. But the country is almost entirely cashless, so your card works everywhere.
          publicToilets:
            name: Public toilets are free
            note: Copenhagen has around 175 of them. The city's map shows the nearest one and its opening hours; park toilets may close in winter.
            url: https://visitorservice.kk.dk/en/explore-copenhagen/public-toilets
  places:
    emoji: 🏰
    title: Places & stories
    blurb: The city makes more sense once you know what you're looking at.
    groups:
      classics:
        title: Classics with a backstory
        items:
          nyhavn:
            name: Nyhavn
            note: The coloured harbour from every postcard. It is busy and touristy, but still worth walking—especially early or after dinner.
          christiansborg:
            name: Christiansborg & the Tower
            note: Parliament, palace and a free city view—all on the same island.
            kicker: Third palace on this site
            story: >-
              Christiansborg did not burn three times. The first and second
              palaces burned in 1794 and 1884; today's building is the third.
              Beneath it are the ruins of Bishop Absalon's castle and Copenhagen
              Castle. It now houses Parliament, the Prime Minister's Office, the
              Supreme Court and royal reception rooms.
            url: https://www.ft.dk/da/folkestyret/folketinget-og-christiansborg/christiansborgs-historie
          amalienborg:
            name: Amalienborg
            note: Four matching palaces around one very impressive king on horseback.
            kicker: 1750s · Royal quarter
            story: >-
              Amalienborg was built as four noblemen's palaces around Saly's
              equestrian statue of Frederik V. The royal family moved here after
              Christiansborg burned in 1794. The calm geometry is deliberate:
              Amalienborg is the centre of the grand Frederiksstaden district.
            url: https://www.kongehuset.dk/en/palaces-and-the-royal-yacht/amalienborg/
          tivoli:
            name: Tivoli
            note: "More than an amusement park: a pleasure garden of lights, music, theatre, restaurants and entirely optional rides."
            kicker: Since 1843 · Disney took notes too
            story: >-
              Georg Carstensen opened Tivoli in 1843 as an escape for the city,
              inspired by European pleasure gardens. He mixed Danish romanticism,
              Chinese fantasy and vaguely Middle Eastern scenery so that every
              corner felt like a different little world. The 1874 Pantomime
              Theatre, with its Chinese facade and mechanical peacock curtain,
              has kept a commedia dell'arte tradition alive since the park opened.
              Walt Disney visited in 1951 and returned after Disneyland opened,
              studying Tivoli's atmosphere, cleanliness and attention to detail.
              H.C. Andersen was among the first visitors and found inspiration
              here for The Nightingale.
            url: https://www.tivoli.dk/en/about-tivoli/the-history-of-tivoli-gardens
          christiania:
            name: Christiania
            note: A resident-run community born in a squatted military area—not just the former hash street.
            kicker: 1971 → a new chapter
            story: >-
              In 1971 neighbours, squatters and hippies moved into abandoned
              barracks and built a “freetown” around local self-government,
              shared responsibility and community meetings. You cannot simply
              buy a home here: vacancies are announced, people apply and the
              local area chooses its new resident. A foundation bought much of
              the land from the state in 2012. After years of gang violence
              around the open cannabis market, residents voted to close Pusher
              Street. On 6 April 2024 its cobbles were dug up, and the street is
              now being remade around legal activities, culture and everyday life.
            url: https://www.christiania.org/info/christianias-historie/
          lakes:
            name: Søerne (The Lakes)
            note: Three long lakes and the city's favourite 6.35 km walking loop.
            kicker: Wetlands → water supply → city walk
            story: >-
              Sankt Jørgens Sø, Peblinge Sø and Sortedams Sø grew from low
              wetlands into a carefully managed water system. Over the centuries
              they powered mills, stored drinking water and strengthened the
              city's defences. Today their hard-working past is mostly hidden
              beneath Copenhagen's favourite walking and running route. In a
              properly cold winter parts can become a rare public ice square—but
              only step onto the ice when the city has put up the blue “ice
              traffic permitted” signs.
            url: https://www.visitcopenhagen.com/copenhagen/planning/copenhagen-lakes-gdk412235
          kingsGarden:
            name: Kongens Have
            note: Copenhagen's oldest royal garden, with Rosenborg Castle and the Crown Jewels in the treasury below.
            kicker: 1600s · Castle above, crowns below
            story: >-
              Christian IV laid out the garden and built Rosenborg as his small
              favourite castle in the early 1600s. It later became a museum of
              the monarchy. The treasure is not buried in the foundations: the
              royal crowns, regalia and Danish Crown Jewels are displayed in the
              Treasury beneath the castle.
            url: https://denkongeligesamling.dk/en/rosenborg-castle/
          kastellet:
            name: Kastellet
            note: A working star fortress that doubles as one of the city's best walks.
            kicker: 1662–65 · Frederik III
            story: >-
              Christian IV began the fortifications, but Frederik III completed
              Kastellet with Dutch engineer Henrik Rüse. It is still an active
              military workplace and is also open as a public park. Look up at
              Kongeporten: the face above the gate is a bust of Frederik III.
            url: https://www.forsvaret.dk/da/side/kastellet/kastellets-historie/
          assistens:
            name: Assistens Cemetery
            note: Nørrebro's greenest history book—and still an active cemetery.
            kicker: Since 1760
            story: >-
              Assistens opened when burial space inside Copenhagen's walls ran
              out. It later became the resting place of H.C. Andersen, Søren
              Kierkegaard, Niels Bohr, H.C. Ørsted and musician Natasja Saad.
              Parts feel like a park, but other areas remain active burial ground,
              so follow the signs and keep it respectful.
            url: https://www.visitcopenhagen.com/copenhagen/planning/assistens-cemetery-gdk964360
          magstraede:
            name: Magstræde
            note: "One of the city's oldest streets: narrow, cobbled and lined with facades that survived the great fires in the centre."
      stories:
        title: Statues, fountains & curious copies
        items:
          gefion:
            name: Gefion Fountain
            note: Copenhagen's most dramatic fountain, just outside Kastellet.
            kicker: 1908 · Norse legend
            story: >-
              The goddess Gefion drives four oxen—her sons transformed—while
              ploughing the island of Zealand out of Sweden. Anders Bundgaard's
              fountain was funded for Carlsberg's 50th anniversary and finished
              in 1908. The matching hole left in Sweden is, according to the
              legend, Lake Vänern.
            url: https://www.visitcopenhagen.com/copenhagen/planning/gefion-fountain-gdk410604
          littleMermaid:
            name: The Little Mermaid
            note: Smaller and quieter than the crowd around her suggests.
            kicker: 1913 · H.C. Andersen
            story: >-
              Brewer Carl Jacobsen commissioned Edvard Eriksen after seeing a
              ballet based on H.C. Andersen's tale. Eriksen's wife Eline modelled
              for the sculpture. The mermaid has watched the harbour since 1913
              and has survived repeated vandalism, repairs and endless tourist
              photographs.
            url: https://www.visitcopenhagen.com/copenhagen/planning/the-little-mermaid-gdk586951
          david:
            name: David by the harbour
            note: Michelangelo in Copenhagen? A full-size bronze cast, not a counterfeit.
            kicker: 1897 · The art of copying
            story: >-
              Carl Jacobsen commissioned this bronze cast of Michelangelo's David
              for Copenhagen. It first stood near City Hall in 1897, where its
              nudity caused complaints, and moved to the harbour in 1993. The
              original remains in Florence; this copy introduces the Royal Cast
              Collection behind it.
            url: https://www.open.smk.dk/en/artwork/image/DEP466/1
          storkFountain:
            name: Stork Fountain
            note: The busy fountain on Amagertorv—with birds that are actually herons.
            kicker: 1894 · Strøget
            story: >-
              The fountain was unveiled in 1894 and quickly became one of
              Strøget's best-known meeting points. Its three birds are herons,
              despite the name. Since 1950, newly qualified midwives have kept
              the wonderfully specific tradition of dancing around it.
            url: https://www.visitcopenhagen.com/copenhagen/planning/the-stork-fountain-gdk410612
          caritas:
            name: Caritas Fountain
            note: Copenhagen's oldest fountain, hiding in plain sight on Gammeltorv.
            kicker: 1608 · Water for the city
            story: >-
              Christian IV gave Caritas to Copenhagen when Gammeltorv was the
              city's main civic square. It was not only decoration: water arrived
              from Emdrup Sø through hollow wooden pipes, and people used the well
              below for everyday water. The figures represent charity and love.
            url: https://cphmuseum.kk.dk/en/whats-on/greed-garbage-and-grand-architecture-an-almost-free-guided-tour-in-copenhagen
      harbour:
        title: The harbour, rebuilt
        route:
          label: Easy waterside walk
          stops:
            - Amalienborg
            - Nyhavn
            - Skuespilhuset
            - Papirøen
            - Operaparken
            - Operaen
        items:
          playhouse:
            name: Skuespilhuset & Ofelia Plads
            note: Theatre, public promenade and a front-row view of the harbour.
            kicker: 2008 · Drama by the water
            story: >-
              The glass-fronted building at the end of Nyhavn is the Royal Danish
              Playhouse—not part of the Opera building, although both belong to
              the Royal Danish Theatre. You can enter the foyer or walk its oak
              promenade without a ticket. Aamanns currently runs the restaurant
              on the ground floor.
            url: https://www.kglteater.dk/dit-besoeg/lokationer/skuespilhuset/
          papiroen:
            name: Papirøen
            note: From naval stores and newspaper rolls to a new waterside neighbourhood.
            kicker: 1696 → now
            story: >-
              Christiansholm is an artificial island that has stored cannons,
              coal and, from 1958, huge newspaper-paper rolls—the source of its
              nickname. Copenhagen Street Food opened the former warehouses to
              the public in 2014. Today there are new waterfront homes—including
              private, social and student housing—plus cafés, a hotel and public
              spaces; the old street-food spirit moved on to Reffen. And no, the
              new apartments are not made of paper. I checked.
            url: https://papiroeen.dk/historien/
          opera:
            name: Operaen
            note: Denmark's monumental opera house, directly across from Amalienborg.
            kicker: 2005 · A gift to Denmark
            story: >-
              The A.P. Møller Foundation funded the opera house and gave it to
              Denmark; Mærsk Mc-Kinney Møller personally influenced many design
              decisions. Henning Larsen was the architect, and their disagreements
              helped make the building famously controversial. Its position ends
              the grand visual axis from Marmorkirken through Amalienborg.
            url: https://www.apmollerfonde.dk/projekter/operaen/
          vaeksthuset:
            name: Væksthuset in Operaparken
            note: The full-glass greenhouse beside the Opera is a café and restaurant inside a public park.
            kicker: Greenhouse · coffee, lunch or dinner
            story: >-
              Operaparken opened in 2023 between Papirøen and the Opera. Its six
              gardens, 600 trees and central glass greenhouse sit above a
              two-storey car park. Væksthuset is the café and restaurant inside
              the greenhouse—not another part of the Opera—and the park is free
              to enter all year.
            url: https://maps.app.goo.gl/5o2TLkcnDbcvyw7z5
      waterfront:
        title: Water, swimming & piers
        items:
          laBanchina:
            name: La Banchina
            note: A tiny café and restaurant on a Refshaleøen pier, with harbour swimming and a sauna practically beside your table.
            kicker: Refshaleøen · all year
            story: >-
              It occupies a small former industrial building right on the harbour.
              The changing menu focuses mostly on vegetables and fish, the wine
              is natural, and plenty of people come simply for coffee, a sunset
              drink or a dip. The little sauna is booked separately. Few places
              combine Refshaleøen's post-industrial side and Copenhagen's life on
              the water quite as neatly.
            url: https://www.labanchina.dk/
          islandsBryggeBath:
            name: Islands Brygge Harbour Bath
            note: "The classic urban swim: harbour pools, a lawn full of people and the city skyline across the water."
            kicker: City centre · very local in summer
            story: >-
              Reopening the harbour for swimming is one of Copenhagen's most
              successful transformations. Here, an industrial waterfront became
              a public living room with protected pools and diving platforms.
              Always check the signs and water quality before getting in: swim
              only inside official bathing zones.
            url: https://www.visitcopenhagen.com/copenhagen/things-to-do/outdoor/baths-and-beaches
          sandkaj:
            name: Sandkaj
            note: An official swimming zone and boardwalk in new Nordhavn, with ladders into the water, cafés and modern housing all around.
            kicker: Nordhavn · urban swimming
            url: https://www.visitcopenhagen.com/copenhagen/things-to-do/outdoor/baths-and-beaches
          fisketorvetBath:
            name: Fisketorvet Harbour Bath
            note: "Harbour pools beside the Bicycle Snake: a useful pause between Vesterbro, the shopping centre and the Kalvebod waterfront."
            kicker: Protected pools · Bicycle Snake
            url: https://www.visitcopenhagen.com/copenhagen/things-to-do/outdoor/baths-and-beaches
          bellevue:
            name: Bellevue
            note: A sandy beach north of the city, with Arne Jacobsen's white-and-blue modernist world practically behind it.
            kicker: Klampenborg · beach + design
            story: >-
              Bellevue belongs to the modernist landscape Arne Jacobsen designed
              around Klampenborg in the 1930s: theatre, Bellavista housing,
              bathing structures and coordinated details. It is easy to reach by
              S-train and pairs particularly well with a walk through Dyrehaven.
            url: https://www.visitcopenhagen.com/copenhagen/areas/beyond-copenhagen/bellevue-the-good-life
      neighbourhoods:
        title: Neighbourhoods
        items:
          norrebro:
            name: Nørrebro
            note: Vibrant and historic, one of the most multi-ethnic and diverse parts of Copenhagen.
          christianshavn:
            name: Christianshavn
            note: A canal district designed as a little Dutch-inspired city of its own.
            kicker: Founded 1617–18
            story: >-
              Christian IV ordered Christianshavn built on shallow, reclaimed
              land to protect the harbour and create a fortified merchant town.
              Johan Semp planned its straight streets and canals in the Dutch
              style. It was briefly independent, then grew wealthy through
              international shipping—including Denmark's colonial trade.
            url: https://kp24.kk.dk/retningslinjer/kulturarv/vaerdifulde-kulturmiljoeer/21-christianshavn
          nordhavn:
            name: Nordhavn
            note: A new neighbourhood on an artificial peninsula, with the waterbus terminal.
          amagerStrand:
            name: Amager Strand
            note: A long urban beach with a lagoon, dunes and views of the Øresund windmills; the Metro gets you there and yes, you can swim.
      modern:
        title: Architecture & curiosities
        items:
          superkilen:
            name: Superkilen
            note: A park in Nørrebro you've probably already seen in a commercial.
          copenhill:
            name: CopenHill (Amager Bakke)
            note: An incinerator with a ski slope on top. Free elevator to the roof, but a bit out of the way — nothing fancy.
          kaktusTowers:
            name: Kaktus Towers
            note: Two prickly BIG towers with rotating floors, rental apartments and an elevated public park above the city.
            kicker: 80 metres · BIG
            story: >-
              Each floor turns slightly from the one below, creating the pointed
              balconies that gave the towers their cactus nickname. They are
              mainly compact rental homes with shared facilities; the useful part
              for a visitor is the public green route at their base, connected to
              the IKEA rooftop and the new district behind Central Station.
            url: https://dac.dk/en/magazine/places/kaktus-towers-prickly-architecture-231
          nyboder:
            name: Nyboder
            note: The long yellow houses Christian IV built for the Navy; many are still Defence rental homes today.
            kicker: Since 1631 · naval housing
            story: >-
              Nyboder roughly means “new little houses”. Christian IV built them
              for sailors, craftsmen and junior officers, creating a service
              neighbourhood in the centre of town. They are not merely a postcard
              backdrop: the Danish Defence still manages roughly six hundred
              rental homes here, primarily for its own employees.
            url: https://www.ejendomsstyrelsen.dk/da/arbejdsomraader/salg-og-leje/forsvarets-lejeboliger/
          grundtvigChurch:
            name: Grundtvig's Church
            note: A yellow-brick expressionist cathedral in Bispebjerg, with a facade that looks simultaneously like an organ and a cliff.
            kicker: Six million bricks · 1940
            story: >-
              Peder Vilhelm Jensen-Klint fused the scale of a Gothic cathedral
              with the plain forms of Danish village churches; after his death,
              his son Kaare completed the building and designed its chairs.
              Online it is often nicknamed “the Shrek church” because it resembles
              the church where Fiona almost marries Lord Farquaad, but DreamWorks
              has never confirmed that it was actually the model.
            url: https://www.visitcopenhagen.com/copenhagen/planning/grundtvigs-church-gdk410661
      shops:
        title: Shops worth the stop
        items:
          legoStore:
            name: LEGO Store Copenhagen
            note: Two floors on Vimmelskaftet, in the middle of Strøget. Build-a-minifigure wall, big city models, and the Pick & Build bricks by weight.
            kicker: Danish since 1932
            story: >-
              LEGO comes from Billund in Jutland, where Ole Kirk Kristiansen
              started making wooden toys in 1932; the name is short for "leg
              godt" — play well. The plastic interlocking brick as we know it
              was patented in 1958. The Copenhagen flagship is the easy city
              stop; the full experience is LEGO House in Billund.
            url: https://www.lego.com/en-dk/stores/store/copenhagen
          illumBolighus:
            name: Illums Bolighus
            note: The place for Danish design, from a useful souvenir to furniture you cannot take home.
            url: https://www.illumsbolighus.com/
          royalCopenhagen:
            name: Royal Copenhagen
            note: Blue-and-white porcelain, very Danish and very pretty. The outlet is better for a serious bargain hunt.
            url: https://www.royalcopenhagen.com/en-int/
  funfacts:
    emoji: 🇩🇰
    title: Very Danish things
    blurb: The things that make visitors stop and ask, “wait—why?”
    groups:
      denmark:
        title: Small explanations for big Danish habits
        items:
          hygge:
            name: Hygge, no candles required
            note: Feeling comfortably together, without rushing or turning everything into an event. It can be dinner, a picnic or coffee in the rain.
            kicker: Pronounced roughly “hoo-gah”
            story: >-
              Hygge is often translated as cosiness, but the feeling matters more:
              unhurried time, an informal atmosphere and people whose company is
              easy. It needs no beige decorations and is not limited to winter;
              a barbecue, bike ride or harbour swim can all be hyggelige. The word
              came from Norwegian and appeared in written Danish around the end
              of the eighteenth century.
            url: https://www.visitdenmark.com/denmark/things-to-do/traditions-lifestyle/hygge
          danishBrands:
            name: Danish brands worth recognising
            note: "It is not only LEGO and it is not only furniture: a short list of Danish names found in shops, homes and far beyond."
            kicker: Design · fashion · industry
            storyItems:
              - "Furniture and objects: HAY, Muuto, Normann Copenhagen, &Tradition, Georg Jensen and Kay Bojesen."
              - "Fashion and accessories: GANNI, Samsøe Samsøe, Rains, Wood Wood and Mads Nørgaard."
              - "Royal Copenhagen: the classic blue-and-white porcelain."
              - "Bang & Olufsen: the audio side of Danish design."
              - "Energy: Vestas for wind turbines and Ørsted for renewable energy."
              - "Pharmaceuticals: Novo Nordisk, one of Denmark's largest and best-known global companies."
              - "Shipping and logistics: Mærsk, Denmark's container giant."
              - "Jewellery and shoes: Pandora and ECCO."
              - "Illums Bolighus: the easiest place to see many of these names together."
          studentTrucks:
            name: The loud graduation trucks
            note: At the end of June, each graduating class tours every student's home in a decorated open truck—with white caps, music and almost no volume control.
            kicker: Studenterkørsel · late June
            story: >-
              The white cap marks the end of upper-secondary school. Then the
              whole class climbs onto a decorated truck and spends the day
              stopping at every classmate's family home for food, drinks and a
              very short party. The truck ride is the loud, moving finale of a
              Danish graduation ritual that is more than a century old.
            url: https://researchprofiles.ku.dk/en/publications/graduation-in-denmark-secular-ritual-and-civil-religion/
          oresundLink:
            name: The bridge that becomes a tunnel
            note: The link to Sweden is not half bridge and half underwater—it is 8 km of bridge, a 4 km artificial island and a 4 km tunnel.
            kicker: Øresund Link · 15.9 km
            story: >-
              From Sweden the route crosses the Øresund Bridge, lands on the
              artificial island Peberholm and then disappears into the Drogden
              Tunnel before reaching Copenhagen Airport. The tunnel keeps the
              approach to the airport clear and leaves the shipping channel open.
            url: https://www.oresundsbron.com/en/about-oresundsbron/about-us/facts-about-oresundsbron
          danishLanguage:
            name: Danish really is hard to hear
            note: Danish has unusually many vowel-like sounds, so word boundaries blur—even Danish-learning toddlers have to work harder.
            kicker: Too many vowels, apparently
            story: >-
              Aarhus University research links Danish's reduced consonants and
              many vowel-like sounds to slower early language processing. In one
              comparison, Danish children knew about 30% fewer words at 15 months
              than Norwegian children and took almost two years longer to master
              the past tense. It is not just an excuse foreigners invented.
            url: https://projects.au.dk/the-puzzle-of-danish/about-the-project
          cyclingComeback:
            name: Copenhagen was not always a bike city
            note: Cars nearly displaced bicycles in the 1960s. The 1973 oil crisis, car-free Sundays, protests and decades of safer lanes brought them back.
            kicker: A comeback, not a miracle
            story: >-
              Bikes were already mass transport here in the 1920s and 1930s,
              but post-war prosperity pushed Copenhagen towards cars. The oil
              crisis made that model look fragile; environmental protests and
              public pressure then demanded space for bicycles. Continuous
              investment in protected routes made cycling the easy everyday
              option—not simply the fact that Denmark is flat.
            url: https://denmark.dk/people-and-culture/biking
          frozenLakes:
            name: When Søerne becomes a city square
            note: In a properly cold winter, a safe part of the frozen lakes fills with walkers and skaters. Wait for the city's blue permission signs.
            kicker: Rare, cold and extremely Copenhagen
            url: https://www.instagram.com/reel/DVHRB9PiILm/
            linkText: Watch the reel
  food:
    emoji: 😋
    title: What to eat
    blurb: Danish cuisine isn't life-changing, but smørrebrød is worth it.
    groups:
      markets:
        title: Markets
        items:
          torvehallerne:
            name: Torvehallerne
            note: Two covered halls full of produce, specialist stalls and small meals—an easy place to try smørrebrød without booking.
          reffen:
            name: Reffen
            note: Street food in old containers on the industrial side of the harbour, with outdoor tables, workshops and lots of space; check seasonal opening.
          broens:
            name: Broens Gadekøkken
            note: The Bridge Street Kitchen, just across from Nyhavn. Outdoor.
          kodbyen:
            name: Kødbyen
            note: The Meatpacking District — bars and restaurants in old butcher halls.
          tivoliFoodHall:
            name: Tivoli Food Hall
            note: An easy central food-hall stop, right by Central Station. You can enter from the street without a Tivoli ticket.
            url: https://www.tivoli.dk/en/food-and-drinks/tivoli-food-hall
      dining:
        title: Dining
        items:
          detLilleApotek:
            name: Det Lille Apotek
            note: One of the city's oldest restaurants, with low rooms, candles and traditional Danish cooking without creative reinterpretation.
          aamanns:
            name: Aamanns 1921
            note: Modern, carefully built smørrebrød in a proper restaurant rather than a quick lunch stop—excellent, but check the prices first.
          gasolineGrill:
            name: Gasoline Grill
            note: A Copenhagen burger institution with a lot of international hype. Go if a very good burger and a queue sound like lunch.
            url: https://gasolinegrill.com/
      coffee:
        title: Coffee with a reason to stop
        items:
          originalCoffeeIllum:
            name: Original Coffee, ILLUM Rooftop
            note: Specialty coffee on top of ILLUM; the real reason to go up is drinking it above Strøget with the city roofs in view.
            kicker: Free view · above Strøget
            url: https://originalcoffee.dk/en/pages/illum-rooftop
          mirabelle:
            name: Mirabelle / Lazy Bakery
            note: Sourdough bread, pastries that change daily and a proper espresso at the counter, still advertised at 10 kroner.
            kicker: Nørrebro · espresso al banco
            story: >-
              Mirabelle's bakery brings a small Italian habit to Copenhagen:
              quick espresso, drunk standing at the counter and at a remarkably
              kind price for the city. The website currently lists it at ten
              kroner; because prices change, check that it still applies when you
              visit. Bread and pastry choices vary from day to day.
            url: https://www.mirabelle-spiseria.dk/lazy-bakery
  pastries:
    emoji: 🍰
    title: Pastries
    blurb: Cardamom, butter and a very good reason to get up early.
    groups:
      bakeries:
        title: Bakeries
        items:
          andersen:
            name: Andersen
            note: An Islands Brygge bakery for precisely made bread, croissants and pastries—a useful detour to combine with the harbourfront.
          juno:
            name: Juno
            note: The city's most famous cardamom bun in a tiny Østerbro bakery. Go early and expect at least a little queue.
          lagkagehuset:
            name: Lagkagehuset
            note: "A chain found almost everywhere: less special than an independent bakery, but reliable for bread, pastries and breakfast without a detour."
          alice:
            name: Alice, Amager
            note: Proper pastries, coffee and seasonal ice cream. Try the cardamom ice cream if it's on.
            url: https://maps.app.goo.gl/932ZVTmvULBaKjFJ7
          kongHansBakery:
            name: Kong Hans Bakery
            note: From the team behind two-Michelin-starred Kong Hans Kælder, this still-under-the-radar bakery treats bread, viennoiserie and pâtisserie with fine-dining precision.
            kicker: Østerbro · opened in 2025
            story: >-
              Kælder means “cellar” and belongs to the historic restaurant that
              inspired the project; the bakery is a separate place on Øster
              Farimagsgade. It brings the same precision out into everyday city
              life, combining French technique, Nordic discipline, long-fermented
              bread, croissants and pâtisserie. The space is small and relatively
              new, so a queue should not be a surprise.
            url: https://konghansbakery.dk/en/
          morePastries:
            name: More pastry ideas
            note: A useful Instagram list with more bakeries to save for later. It is not my list, so treat it as extra inspiration rather than gospel.
            url: https://www.instagram.com/p/DOSrrF8DJpF/
  museums:
    emoji: 🏺
    title: Museums
    blurb: Rainy day? Perfect, that's most days.
    groups:
      art:
        title: Art & history
        items:
          smk:
            name: SMK
            note: "Denmark's National Gallery: Danish art, major European painters and a modern wing looking onto Østre Anlæg park."
          nationalmuseet:
            name: Nationalmuseet
            note: The fullest route through Danish history, from prehistory and Vikings to the details of more recent everyday life.
          thorvaldsens:
            name: Thorvaldsens Museum
            note: Neoclassical sculpture inside rooms with painted ceilings and unexpected colour—small enough not to consume the whole day.
          glyptotek:
            name: Ny Carlsberg Glyptotek
            note: Egyptian, Greek and Roman antiquities, French painting and a palm-filled winter garden that is nearly worth the visit alone.
          cisternerne:
            name: Cisternerne
            note: Changing art installations inside Copenhagen's old underground water reservoirs—dark, damp and unlike a conventional museum.
          experimentarium:
            name: Experimentarium
            note: Three floors of hands-on experiments, water play and a rooftop terrace—excellent with children and on long rainy days.
          louisiana:
            name: Louisiana Museum of Modern Art
            note: Outside the city, around one hour by train. Worth the whole day.
          museumGuide:
            name: Copenhagen's top museums
            note: The official round-up for comparing collections, neighbourhoods and less obvious options when you only have time for one museum.
            url: https://www.visitcopenhagen.com/copenhagen/activities/copenhagens-top-museums
  saunas:
    emoji: 🧖
    title: Saunas
    blurb: Hot room, cold harbour, repeat. Very Nordic.
    groups:
      sweat:
        title: Where to sweat
        items:
          glaecier:
            name: Glaecier
            note: A floating Refshaleøen club with sauna, filtered harbour-water pool and panoramic views; normally members-only except for Open Gus sessions.
            url: https://glaecier.com/en/
          sauna85:
            name: Sauna85
            note: Bookable saunagus without a membership at several locations—an easy introduction to heat, essential oils and a cold plunge.
            url: https://www.sauna85.dk/en/
          pluginHeat:
            name: Plugin Heat Club
            note: Guided 75-minute sessions alternating three rounds of sauna and cold, with locations in Amager and Sydhavn.
            url: https://www.pluginheatclub.com/
          platform:
            name: Platform CPH
            note: An urban sauna by BLOX and the harbour, convenient if you want to add a gus session to a day in the centre.
            url: https://www.platformcph.com/
          kynd:
            name: KYND Sauna
            note: Saunagus, private hire and very different locations; Kalvebod Brygge has a panoramic harbour view and direct water access.
            kicker: Formerly Mobilsauna · several locations
            url: https://kynd.dk/
  boats:
    emoji: ⛵
    title: Boats
    blurb: Copenhagen makes more sense from the water. Pick who gets to steer.
    groups:
      sail:
        title: Choose your boat
        items:
          goboat:
            name: GoBoat
            note: A quiet electric picnic boat you drive yourself. Bring snacks and take the harbour slowly.
            kicker: Self-drive · No licence needed
            url: https://goboat.dk/en/copenhagen
          friendships:
            name: FriendShips
            note: Another electric picnic boat you can drive yourself, right in the centre. Bring your own food and drinks.
            kicker: Self-drive · Up to 8 people
            url: https://www.friendships.dk/
          heyCaptain:
            name: Hey Captain
            note: A small, social canal tour with a captain rather than a large sightseeing boat.
            kicker: Guided · Public or private
            url: https://www.heycaptain.dk/
          duffyBoats:
            name: Duffy Boats
            note: A comfortable electric boat with its own captain — the relaxed option if no one wants to steer.
            kicker: Captained · Bring a picnic
            url: https://duffyboats.dk/
  beyond:
    emoji: 🚆
    title: Beyond Copenhagen
    blurb: The rest of Denmark is small, flat and very reachable by train.
    groups:
      daytrips:
        title: Easy day trips (under ~1h by train)
        items:
          frederiksborg:
            name: Frederiksborg Castle, Hillerød
            note: A Renaissance castle on three islets, with baroque gardens behind it. The most beautiful of the lot.
            travel: 40 min from Nørreport
            kicker: Christian IV · 1600s
            story: >-
              Christian IV rebuilt Frederiksborg as his showpiece castle in the
              early 1600s. After a fire in 1859 the brewer J.C. Jacobsen paid
              for its restoration, and it reopened as the Museum of National
              History. The terraced baroque garden behind the castle is free
              to walk.
            url: https://dnm.dk/en/
          kronborg:
            name: Kronborg Castle, Helsingør
            note: Hamlet's castle, guarding the narrowest point of the Øresund. Sweden is right there.
            travel: 45 min from Copenhagen H
            kicker: UNESCO · Hamlet
            story: >-
              Kronborg controlled the Sound and the toll every passing ship had
              to pay, which made the Danish crown rich. Shakespeare turned it
              into Elsinore in Hamlet without ever visiting. Under the castle
              sleeps Holger Danske, who legend says wakes when Denmark needs him.
            url: https://kongeligeslotte.dk/en/palaces-and-gardens/kronborg-castle.html
          roskilde:
            name: Roskilde
            note: Royal cathedral plus five Viking ships raised from the fjord — and you can sail a reconstruction.
            travel: 25 min by train
            kicker: Cathedral + Viking ships
            story: >-
              Roskilde was Denmark's capital in the Middle Ages, and its brick
              cathedral is the burial church of Danish kings and queens. Down at
              the fjord, five ships were deliberately sunk around 1070 to block
              the channel; they were excavated in 1962 and now sit in the Viking
              Ship Museum.
            url: https://www.vikingeskibsmuseet.dk/en
          louisianaTrip:
            name: Louisiana, Humlebæk
            note: Modern art, sea view and a sculpture park. Half a day minimum.
            travel: 35 min by train + short walk
          dyrehaven:
            name: Dyrehaven
            note: A former royal reserve full of deer, trails and ancient oaks just beyond Bellevue—real nature within S-train reach.
            travel: ~20 min to Klampenborg
            kicker: UNESCO · free-roaming deer
            story: >-
              The former royal hunting ground preserves long star-shaped avenues
              made for par force hunting, now part of North Zealand's UNESCO
              landscape. Red, fallow and sika deer roam freely: keep your distance
              and do not feed them. It combines easily with Bellevue or Bakken,
              the amusement park hidden inside the woods.
            url: https://www.visitcopenhagen.com/copenhagen/planning/deer-park-gdk414367
          malmo:
            name: Malmö, Sweden
            note: Take the train across the Øresund Bridge. Another country before lunch — bring your passport or ID.
            travel: 35 min from Copenhagen H
          lund:
            name: Lund, Sweden
            note: A compact university city with a Romanesque cathedral, low houses and cobbled streets—quieter than Malmö and ideal for a slow day.
            travel: ~55 min by direct train
            kicker: University since 1666 · Skåne
            story: >-
              Lund was an important Danish religious centre before Scania became
              Swedish in the seventeenth century. Its cathedral has an eleventh-
              century crypt and astronomical clock; around it, the university and
              Kulturen fill the centre with courtyards, museums and students.
              Bring valid identification: you are still crossing a border.
            url: https://visitlund.se/en
          skybarMalmo:
            name: Skybar, Malmö Live
            note: A Malmö stop for food or drinks with a big view over the city.
            url: https://maps.app.goo.gl/EyKtERFBjXYHZ5pc8
          bullenMalmo:
            name: Bullen – Två Krögare
            note: A historic dining room serving old-school Swedish cooking without fuss—meatballs, herring and sturdy dishes in central Malmö.
            url: https://maps.app.goo.gl/TJjq7w8dQaPwn2JC7
      longer:
        title: Worth the longer ride
        items:
          monsKlint:
            name: Møns Klint
            note: White chalk cliffs dropping 120 m into turquoise water, with beech forest on top. Denmark's most unexpected landscape.
            travel: ~2h by car, longer by bus
            kicker: 70 million years old
            story: >-
              The cliffs are chalk formed from the shells of countless tiny sea
              creatures, pushed up by the ice age. Fossils wash out on the beach
              below — look for belemnites and sea urchins. Møn is also a Dark
              Sky reserve, so the night sky is unusually good.
            url: https://www.moensklint.dk/en/
          stevnsKlint:
            name: Stevns Klint
            note: The same chalk, closer to town, with a UNESCO-listed line marking the day the dinosaurs died.
            travel: ~1h 15 by car
            kicker: UNESCO · the K-Pg boundary
            story: >-
              In the cliff face runs a thin dark layer of "fish clay" — debris
              from the asteroid impact that ended the age of the dinosaurs 66
              million years ago. Above it, the church of Højerup slowly lost its
              choir to the sea in 1928.
            url: https://www.stevnsklint.dk/en/
          odense:
            name: Odense
            note: H.C. Andersen's hometown, with a museum built around the house where he was born.
            travel: 1h 15 by train
            kicker: Fairy tales · Funen
            story: >-
              Andersen grew up poor in Odense and left for Copenhagen at
              fourteen. The new H.C. Andersen's House by Kengo Kuma is built
              half underground, arranged like a fairy tale rather than a
              biography. The old quarter around it is one of Denmark's
              prettiest.
            url: https://hcandersenshus.dk/en
          bornholm:
            name: Bornholm
            note: Denmark's Baltic island for smoked fish, rocky coasts, beaches and a proper slow weekend away.
            travel: Ferry or a short flight from Copenhagen · stay over
            kicker: Island escape
            story: >-
              Bornholm feels unlike the rest of Denmark: granite cliffs and
              round churches in the north, broad beaches in the south, and
              smokehouses everywhere. It is too much for a day trip, so make a
              weekend of it—take the ferry or fly from Copenhagen, then use the
              island buses or a bike to wander.
            url: https://visit-bornholm.com/en/plan-your-trip-to-bornholm
          tisvildeleje:
            name: Tisvildeleje
            note: "A laid-back north-coast beach town: sand, colourful beach huts and Tisvilde Hegn forest right behind it."
            travel: ~1h 20 by train
            url: https://www.visitnorthzealand.com/north-zealand/cities/tisvildeleje-historic-seaside-resort-and-young-culture
          gilleleje:
            name: Gilleleje
            note: A working fishing harbour, seafood, old lanes and a proper beach on the Danish Riviera.
            travel: ~1h 15 by train
            url: https://www.visitnorthzealand.com/north-zealand/cities/gilleleje-the-fishing-town-at-the-top-of-north-zealand
          campAdventure:
            name: Camp Adventure
            note: Forest Tower and a huge climbing park in the south of Zealand — a good outdoors day if you have a car.
            travel: ~1h 15 by car
            url: https://www.campadventure.dk/
      jutland:
        title: Jutland & further
        items:
          legoHouse:
            name: LEGO House, Billund
            note: "The real thing: 25 million bricks, six build zones and a whole LEGO town next door at Legoland."
            travel: ~3h by train + bus
            kicker: Home of the brick
            story: >-
              LEGO House stands in Billund, where the company was founded, and
              is shaped like 21 stacked bricks. It is designed for building
              rather than looking: everything inside is hands-on. Legoland is a
              short walk away if you have kids in tow.
            url: https://legohouse.com/en-gb/
          aarhus:
            name: Aarhus
            note: Denmark's second city. Walk the rainbow ring on top of ARoS, then Den Gamle By, an entire old town rebuilt street by street.
            travel: 3h by train
            url: https://www.aros.dk/en/
          aalborg:
            name: Aalborg
            note: A friendly university city on the Limfjord, with a transformed waterfront, the Utzon Center and plenty of street art.
            travel: ~4h by train
            kicker: North Jutland · waterfront city
            url: https://www.visitaalborg.com/
          skagen:
            name: Skagen & Grenen
            note: The very top of Denmark, where two seas meet and you can stand with a foot in each.
            travel: ~5h by train
            kicker: Where the seas collide
            story: >-
              At Grenen the Skagerrak and Kattegat meet head-on, and you can see
              the waves crash into each other from the sandbar. The clear
              northern light drew the Skagen Painters here in the late 1800s,
              and their yellow houses still set the town's look.
            url: https://www.visitdenmark.com/denmark/destinations/north-jutland/skagen
          rubjergKnude:
            name: Rubjerg Knude Lighthouse
            note: A lighthouse on a giant migrating sand dune. It was moved inland on rails in 2019 to stop it falling into the sea.
            travel: ~5h by train + bus
          moreTrips:
            name: Planning day trips
            note: The official collection for comparing castles, coastline, museums and journey times when you want to leave the city.
            url: https://www.visitcopenhagen.com/copenhagen/activities/day-trips-copenhagen
  inspiration:
    emoji: 👻
    title: Inspiration
    blurb: If you want someone else's opinion for once.
    calendarTitle: Events through the year
    groups:
      things:
        title: Things I like
        items:
          nyt:
            name: Things to do in Copenhagen
            note: The New York Times guide for a second opinion on neighbourhoods, restaurants and things to do, maintained separately from this list.
            url: https://www.nytimes.com/interactive/2023/07/20/travel/things-to-do-copenhagen.html
      february:
        title: February
        collapsible: true
        months: [2]
        items:
          lightFestival:
            name: Copenhagen Light Festival
            note: Dark evenings, light installations all over the city. Check the programme and dress warmly.
            url: https://copenhagenlightfestival.org/
      april:
        title: April
        collapsible: true
        months: [4]
        items:
          sakura:
            name: Sakura Festival
            note: Cherry blossom, Japanese food and a very large crowd around Langelinie. Go early.
            url: https://sakurafestival.dk/
          cherryBlossoms:
            name: Cherry blossom walks
            note: Do Kastellet and Langelinie, then the famous pink tunnel at Bispebjerg Cemetery. The streets around Bispebjerg are lovely too.
            url: https://www.visitcopenhagen.com/copenhagen/this-is-copenhagen/seasons/places-to-see-copenhagen-in-its-spring-coat
      june:
        title: June
        collapsible: true
        months: [6]
        items:
          distortion:
            name: Distortion
            note: Copenhagen's loudest street party. Fun, chaotic and completely avoidable if that is not your thing.
            url: https://www.cphdistortion.dk/
          threeDays:
            name: 3daysofdesign
            note: Copenhagen turns into a giant design open house. Many exhibitions are free—book the popular ones.
            url: https://www.3daysofdesign.dk/
          sanktHans:
            name: Sankt Hans
            note: Midsummer bonfires by the water, usually on 23 June. Very Danish, slightly witchy.
            url: https://www.visitcopenhagen.com/copenhagen/activities/sankt-hans-eve-gdk415605
      july:
        title: July
        collapsible: true
        months: [7]
        items:
          jazz:
            name: Copenhagen Jazz Festival
            note: Music spills out of clubs, parks and courtyards for ten summer days. Wander rather than over-plan.
            url: https://jazz.dk/
      august:
        title: August
        collapsible: true
        months: [8]
        items:
          pride:
            name: Copenhagen Pride
            note: Parade, concerts and a lot of people around City Hall Square. Check the programme before you go.
            url: https://www.copenhagenpride.dk/en/
          operaFestival:
            name: Copenhagen Opera Festival
            note: Opera in unexpected places, including free outdoor performances around the harbour.
            url: https://www.operafestival.dk/
      october:
        title: October
        collapsible: true
        months: [10]
        items:
          kulturnatten:
            name: Kulturnatten
            note: One Friday when museums, churches and odd institutions stay open late. Buy the Culture Night Pass.
            url: https://www.kulturnatten.dk/da/Kulturnatten
      december:
        title: December
        collapsible: true
        months: [12]
        items:
          santaLucia:
            name: Santa Lucia parade in kayaks
            note: A floating procession of lights through the canals. Arrive early for a good spot by the water.
            url: https://www.visitcopenhagen.com/copenhagen/planning/santa-lucia-parade-kayaks-gdk1106677
