sections:
  know:
    emoji: 🧯
    title: Cose da sapere
    blurb: Le piccole cose che fanno la differenza.
    groups:
      transport:
        title: Mezzi pubblici
        items:
          metro:
            name: La metro è H24 e senza conducente
            note: È automatica. Metro Service, che la gestisce e mantiene, oggi è di proprietà del gruppo ATM di Milano.
            kicker: Senza conducente · con un legame italiano
            story: >-
              Senza conducenti, uno sciopero dei conducenti non può fermarla: i
              conducenti non ci sono. Esiste naturalmente il personale che
              controlla, mantiene e assiste il sistema. Dalla fine del 2025 Metro
              Service è interamente di proprietà del gruppo milanese ATM; Hitachi
              resta il principale appaltatore per M3 e M4 fino alla scadenza del contratto.
            url: https://www.metroservice.dk/media/5m5pwgyl/metroservice-annual-report-2025.pdf
          paperTickets:
            name: Il biglietto cartaceo non si valida
            note: Ha già l'ora stampata sopra, quindi si sale e via. Vale per metro, bus, treno e vaporetto.
          cityPass:
            name: City Pass Small
            note: Viaggi illimitati solo nelle zone 1–4—centro e aeroporto. Non copre tutta la Zelanda.
            url: https://www.publictransport.dk/tickets/citypass
          copenhagenCard:
            name: Copenhagen Card
            note: Conviene se pensate di visitare vari musei — include mezzi e ingressi.
            url: https://copenhagencard.com
          waterbus:
            name: Vaporetto
            note: È incluso nel normale biglietto dei mezzi. Attraversa il porto, circa ogni mezz'ora — orari su Citymapper.
          sTrainBike:
            name: Le S-train rosse portano gratis la bici
            note: Sono la rete suburbana di Copenaghen, diversa dai treni regionali e InterCity. Sulle S-train la bici è gratis; sugli altri treni valgono regole diverse.
            url: https://www.dsb.dk/s-tog/
      cycling:
        title: Muoversi in bici
        items:
          lights:
            name: Luci obbligatorie dopo il tramonto
            note: Servono due luci—bianca o gialla davanti e rossa dietro—dal tramonto all'alba e quando la visibilità è scarsa.
          stopping:
            name: Alzare sempre il braccio prima di fermarsi
            note: Braccio alzato prima di fermarsi, braccio teso nella direzione della svolta e destra libera per chi vuole superarvi.
          cyclingGuide:
            name: Come si va in bici in Danimarca
            note: Due minuti di lettura che vi risparmiano molte campanelle arrabbiate.
            url: https://politi.dk/-/media/mediefiler/kbh/billeder-diverse/how-to-cycle-in-denmark-(1).pdf
      everyday:
        title: Vita quotidiana
        items:
          deposit:
            name: Non buttate bottiglie e lattine
            note: Hanno un deposito — si riportano al supermercato e vi ridanno i soldi.
            url: https://danskretursystem.dk/en/about-deposits/
          payments:
            name: Pagamenti
            note: Qui si usano le corone danesi, non gli euro. Ma è un Paese quasi senza contanti, la carta funziona ovunque.
          publicToilets:
            name: I bagni pubblici sono gratis
            note: A Copenaghen ce ne sono circa 175. La mappa del Comune mostra quello più vicino e gli orari; quelli nei parchi possono chiudere in inverno.
            url: https://visitorservice.kk.dk/en/explore-copenhagen/public-toilets
  places:
    emoji: 🏰
    title: Posti & storie
    blurb: La città ha più senso quando sapete cosa state guardando.
    groups:
      classics:
        title: Classici con una storia
        items:
          nyhavn:
            name: Nyhavn
            note: Il porticciolo colorato delle foto. Turistico, ma bello.
          christiansborg:
            name: Christiansborg & la Torre
            note: Parlamento, palazzo e vista gratuita sulla città, tutto sulla stessa isola.
            kicker: Il terzo palazzo in questo punto
            story: >-
              Christiansborg non è bruciato tre volte. Il primo e il secondo
              palazzo andarono a fuoco nel 1794 e nel 1884; quello di oggi è il
              terzo. Sotto si trovano le rovine del castello del vescovo Absalon e
              del Castello di Copenaghen. Oggi ospita Parlamento, ufficio del Primo
              Ministro, Corte Suprema e sale di rappresentanza reali.
            url: https://www.ft.dk/da/folkestyret/folketinget-og-christiansborg/christiansborgs-historie
          amalienborg:
            name: Amalienborg
            note: Quattro palazzi uguali attorno a un re a cavallo decisamente imponente.
            kicker: Anni 1750 · Quartiere reale
            story: >-
              Amalienborg nacque come quattro palazzi nobiliari attorno alla
              statua equestre di Frederik V, opera di Saly. La famiglia reale si
              trasferì qui dopo l'incendio di Christiansborg del 1794. La geometria
              ordinata è voluta: Amalienborg è il centro del grande quartiere di
              Frederiksstaden.
            url: https://www.kongehuset.dk/en/palaces-and-the-royal-yacht/amalienborg/
          tivoli:
            name: Tivoli
            note: "Più che un luna park: un giardino di piacere fatto di luci, musica, teatro, ristoranti e giostre facoltative."
            kicker: Dal 1843 · anche Disney prese appunti
            story: >-
              Georg Carstensen aprì Tivoli nel 1843 come luogo di evasione per
              la città, ispirato ai giardini di piacere europei. Mescolò
              romanticismo danese, fantasia cinese e atmosfere orientaleggianti
              perché ogni angolo sembrasse un piccolo mondo diverso. Il Teatro
              della Pantomima del 1874, con facciata cinese e sipario meccanico a
              pavone, mantiene viva la tradizione della Commedia dell'Arte fin
              dall'apertura del parco. Walt Disney visitò Tivoli nel 1951 e tornò
              anche dopo l'apertura di Disneyland, studiandone atmosfera, pulizia
              e attenzione ai dettagli. H.C. Andersen fu tra i primi visitatori e
              qui trovò ispirazione per L'usignolo.
            url: https://www.tivoli.dk/en/about-tivoli/the-history-of-tivoli-gardens
          christiania:
            name: Christiania
            note: Una comunità autogestita nata in un'area militare occupata, non soltanto l'ex via dell'hashish.
            kicker: 1971 → un nuovo capitolo
            story: >-
              Nel 1971 abitanti del quartiere, occupanti e hippie entrarono nelle
              caserme abbandonate e crearono una “città libera” fondata su
              autogestione locale, responsabilità condivisa e riunioni della
              comunità. Qui una casa non si compra semplicemente: quando se ne
              libera una viene pubblicato un annuncio, ci si candida e l'area
              sceglie il nuovo abitante. Nel 2012 una fondazione ha acquistato
              gran parte dei terreni dallo Stato. Dopo anni di violenza tra bande
              intorno al mercato aperto della cannabis, gli abitanti hanno votato
              per chiudere Pusher Street. Il 6 aprile 2024 ne hanno rimosso i
              sampietrini; oggi la strada viene ripensata con attività legali,
              cultura e vita quotidiana.
            url: https://www.christiania.org/info/christianias-historie/
          lakes:
            name: Søerne (I laghi)
            note: Tre laghi allungati e il giro cittadino preferito, lungo 6,35 km.
            kicker: Paludi → acqua potabile → passeggiata
            story: >-
              Sankt Jørgens Sø, Peblinge Sø e Sortedams Sø nacquero da zone umide
              e divennero un sistema d'acqua gestito con cura. Nei secoli hanno
              alimentato mulini, conservato acqua potabile e rafforzato le difese
              della città. Oggi questo passato laborioso è quasi invisibile sotto
              il percorso preferito per passeggiare e correre. In un inverno
              davvero freddo alcune parti possono diventare una rarissima piazza
              sul ghiaccio, ma si sale soltanto quando il Comune espone i cartelli
              blu che autorizzano l'accesso.
            url: https://www.visitcopenhagen.com/copenhagen/planning/copenhagen-lakes-gdk412235
          kingsGarden:
            name: Kongens Have
            note: Il giardino reale più antico della città, con il castello di Rosenborg e i Gioielli della Corona nel tesoro sotterraneo.
            kicker: Seicento · castello sopra, corone sotto
            story: >-
              Christian IV fece realizzare il giardino e Rosenborg come suo
              piccolo castello preferito all'inizio del Seicento. In seguito
              divenne un museo della monarchia. Il tesoro non è murato nelle
              fondamenta: corone, regalia e Gioielli della Corona danese sono
              esposti nei sotterranei del castello.
            url: https://denkongeligesamling.dk/en/rosenborg-castle/
          kastellet:
            name: Kastellet
            note: Una fortezza a stella ancora attiva e una delle passeggiate più belle della città.
            kicker: 1662–65 · Frederik III
            story: >-
              Christian IV iniziò le fortificazioni, ma fu Frederik III a
              completare Kastellet con l'ingegnere olandese Henrik Rüse. È ancora
              un luogo di lavoro militare, ma anche un parco aperto al pubblico.
              Guardate in alto sulla Kongeporten: il volto sopra il portone è il
              busto di Frederik III.
            url: https://www.forsvaret.dk/da/side/kastellet/kastellets-historie/
          assistens:
            name: Cimitero Assistens
            note: Il libro di storia più verde di Nørrebro, ancora oggi un cimitero attivo.
            kicker: Dal 1760
            story: >-
              Assistens aprì quando lo spazio per le sepolture dentro le mura era
              finito. Qui riposano H.C. Andersen, Søren Kierkegaard, Niels Bohr,
              H.C. Ørsted e la musicista Natasja Saad. Alcune zone sembrano un
              parco, altre sono tuttora aree di sepoltura: seguite i cartelli e
              visitatele con rispetto.
            url: https://www.visitcopenhagen.com/copenhagen/planning/assistens-cemetery-gdk964360
          magstraede:
            name: Magstræde
            note: Una delle strade più antiche della città, stretta, acciottolata e fiancheggiata da facciate che sono sopravvissute agli incendi del centro.
      stories:
        title: Statue, fontane & copie curiose
        items:
          gefion:
            name: Fontana di Gefion
            note: La fontana più teatrale della città, appena fuori da Kastellet.
            kicker: 1908 · Leggenda nordica
            story: >-
              La dea Gefion guida quattro buoi, in realtà i suoi figli trasformati,
              mentre ara l'isola di Selandia strappandola alla Svezia. La fontana
              di Anders Bundgaard fu finanziata per i 50 anni di Carlsberg e
              completata nel 1908. Il buco rimasto in Svezia sarebbe il lago Vänern.
            url: https://www.visitcopenhagen.com/copenhagen/planning/gefion-fountain-gdk410604
          littleMermaid:
            name: La Sirenetta
            note: Più piccola e silenziosa di quanto faccia pensare la folla intorno.
            kicker: 1913 · H.C. Andersen
            story: >-
              Il birraio Carl Jacobsen commissionò la statua a Edvard Eriksen dopo
              aver visto un balletto ispirato alla fiaba di H.C. Andersen. La
              moglie di Eriksen, Eline, posò per la scultura. Dal 1913 osserva il
              porto e ha resistito a vandalismi, restauri e infinite fotografie.
            url: https://www.visitcopenhagen.com/copenhagen/planning/the-little-mermaid-gdk586951
          david:
            name: David sul porto
            note: Michelangelo a Copenaghen? Una copia in bronzo a grandezza naturale, non un falso.
            kicker: 1897 · L'arte della copia
            story: >-
              Carl Jacobsen commissionò questa fusione in bronzo del David per
              Copenaghen. Nel 1897 fu collocata vicino al municipio, dove la nudità
              provocò proteste, e nel 1993 arrivò sul porto. L'originale resta a
              Firenze; questa copia introduce la Collezione Reale dei Calchi alle
              sue spalle.
            url: https://www.open.smk.dk/en/artwork/image/DEP466/1
          storkFountain:
            name: Stork Fountain
            note: La fontana affollata di Amagertorv, con uccelli che in realtà sono aironi.
            kicker: 1894 · Strøget
            story: >-
              Inaugurata nel 1894, divenne presto uno dei punti d'incontro più
              conosciuti di Strøget. Nonostante il nome, i tre uccelli sono aironi.
              Dal 1950 le ostetriche appena diplomate mantengono la meravigliosa e
              specifica tradizione di ballare attorno alla fontana.
            url: https://www.visitcopenhagen.com/copenhagen/planning/the-stork-fountain-gdk410612
          caritas:
            name: Fontana Caritas
            note: La fontana più antica di Copenaghen, quasi nascosta in piena vista a Gammeltorv.
            kicker: 1608 · Acqua per la città
            story: >-
              Christian IV regalò Caritas alla città quando Gammeltorv era la
              piazza civica principale. Non era solo decorazione: l'acqua arrivava
              dal lago Emdrup attraverso tubi di legno cavi e gli abitanti usavano
              il pozzo sottostante ogni giorno. Le figure rappresentano carità e amore.
            url: https://cphmuseum.kk.dk/en/whats-on/greed-garbage-and-grand-architecture-an-almost-free-guided-tour-in-copenhagen
      harbour:
        title: Il porto reinventato
        route:
          label: Passeggiata facile sull'acqua
          stops:
            - Amalienborg
            - Nyhavn
            - Skuespilhuset
            - Papirøen
            - Operaparken
            - Operaen
        items:
          playhouse:
            name: Skuespilhuset & Ofelia Plads
            note: Teatro, passeggiata pubblica e posto in prima fila sul porto.
            kicker: 2008 · Teatro sull'acqua
            story: >-
              L'edificio vetrato alla fine di Nyhavn è il Teatro Reale di Prosa,
              non una parte dell'Opera, anche se entrambi appartengono al Teatro
              Reale Danese. Si può entrare nel foyer e percorrere la passerella in
              quercia senza biglietto. Oggi Aamanns gestisce il ristorante al piano terra.
            url: https://www.kglteater.dk/dit-besoeg/lokationer/skuespilhuset/
          papiroen:
            name: Papirøen
            note: Da deposito navale e rotoli di giornale a nuovo quartiere sull'acqua.
            kicker: 1696 → oggi
            story: >-
              Christiansholm è un'isola artificiale che ha conservato cannoni,
              carbone e, dal 1958, enormi rotoli di carta da giornale: da qui il
              soprannome. Nel 2014 Copenhagen Street Food aprì i vecchi magazzini
              al pubblico. Oggi ci sono nuove case sul porto—private, sociali e
              studentesche—oltre a caffè, un hotel e spazi pubblici; lo spirito
              dello street food si è spostato a Reffen. E no, i nuovi appartamenti
              non sono fatti di carta. Ho controllato.
            url: https://papiroeen.dk/historien/
          opera:
            name: Operaen
            note: Il monumentale teatro dell'opera, esattamente di fronte ad Amalienborg.
            kicker: 2005 · Un regalo alla Danimarca
            story: >-
              La Fondazione A.P. Møller finanziò l'edificio e lo donò alla
              Danimarca; Mærsk Mc-Kinney Møller influenzò personalmente molte
              scelte progettuali. L'architetto era Henning Larsen e i loro
              disaccordi resero l'opera famosa e controversa. La posizione chiude
              l'asse visivo che parte da Marmorkirken e attraversa Amalienborg.
            url: https://www.apmollerfonde.dk/projekter/operaen/
          vaeksthuset:
            name: Væksthuset nell'Operaparken
            note: La serra tutta in vetro accanto all'Opera è un caffè e ristorante dentro un parco pubblico.
            kicker: Serra · caffè, pranzo o cena
            story: >-
              Operaparken ha aperto nel 2023 tra Papirøen e l'Opera. I suoi sei
              giardini, 600 alberi e la serra centrale in vetro stanno sopra un
              parcheggio di due piani. Væksthuset è il caffè e ristorante dentro
              la serra, non un'altra parte dell'Opera; il parco è gratuito e
              aperto tutto l'anno.
            url: https://maps.app.goo.gl/5o2TLkcnDbcvyw7z5
      waterfront:
        title: Acqua, bagni e moli
        items:
          laBanchina:
            name: La Banchina
            note: Un minuscolo caffè e ristorante sul molo di Refshaleøen, con bagno in porto e sauna praticamente davanti al tavolo.
            kicker: Refshaleøen · tutto l'anno
            story: >-
              Occupa una piccola ex struttura industriale sul bordo del porto.
              Il menu cambia, punta soprattutto su verdure e pesce e il vino è
              naturale; molte persone vengono semplicemente per un caffè, un
              bicchiere al tramonto o un tuffo. La sauna è piccola e si prenota
              separatamente. È uno dei posti in cui il lato post-industriale di
              Refshaleøen e la vita sull'acqua di Copenaghen si incontrano meglio.
            url: https://www.labanchina.dk/
          islandsBryggeBath:
            name: Havnebadet Islands Brygge
            note: "Il bagno urbano classico: piscine nel porto, prato pieno di gente e skyline della città dall'altra parte dell'acqua."
            kicker: Centro città · molto locale d'estate
            story: >-
              La riapertura del porto alla balneazione è una delle trasformazioni
              più riuscite di Copenaghen. Qui un vecchio waterfront industriale è
              diventato un salotto pubblico con vasche protette e piattaforme per
              tuffarsi. Controllate sempre segnaletica e qualità dell'acqua prima
              di entrare: si nuota soltanto nelle zone ufficiali.
            url: https://www.visitcopenhagen.com/copenhagen/things-to-do/outdoor/baths-and-beaches
          sandkaj:
            name: Sandkaj
            note: Pontile e zona balneare ufficiale nel nuovo Nordhavn, con scale in acqua, caffè e case moderne tutto intorno.
            kicker: Nordhavn · bagno urbano
            url: https://www.visitcopenhagen.com/copenhagen/things-to-do/outdoor/baths-and-beaches
          fisketorvetBath:
            name: Havnebadet Fisketorvet
            note: "Piscine portuali vicino alla Cykelslangen: una sosta utile tra Vesterbro, il centro commerciale e il lungomare di Kalvebod."
            kicker: Vasche protette · Cykelslangen
            url: https://www.visitcopenhagen.com/copenhagen/things-to-do/outdoor/baths-and-beaches
          bellevue:
            name: Bellevue
            note: Spiaggia di sabbia a nord della città, con il mondo bianco e blu progettato da Arne Jacobsen praticamente alle spalle.
            kicker: Klampenborg · spiaggia + design
            story: >-
              Bellevue fa parte del paesaggio modernista che Arne Jacobsen
              disegnò attorno a Klampenborg negli anni Trenta: teatro, complesso
              residenziale Bellavista, strutture balneari e dettagli coordinati.
              Si raggiunge facilmente in S-train e si combina bene con una
              passeggiata a Dyrehaven.
            url: https://www.visitcopenhagen.com/copenhagen/areas/beyond-copenhagen/bellevue-the-good-life
      neighbourhoods:
        title: Quartieri
        items:
          norrebro:
            name: Nørrebro
            note: Vivace e storico, uno dei quartieri più multietnici della città.
          christianshavn:
            name: Christianshavn
            note: Un quartiere di canali progettato come una piccola città di ispirazione olandese.
            kicker: Fondato nel 1617–18
            story: >-
              Christian IV fece costruire Christianshavn su bassifondi bonificati
              per proteggere il porto e creare una città mercantile fortificata.
              Johan Semp ne disegnò strade dritte e canali in stile olandese. Fu
              per breve tempo indipendente, poi prosperò con il commercio
              internazionale, compreso quello coloniale danese.
            url: https://kp24.kk.dk/retningslinjer/kulturarv/vaerdifulde-kulturmiljoeer/21-christianshavn
          nordhavn:
            name: Nordhavn
            note: Uno dei quartieri nuovi, su una penisola artificiale, con il capolinea del vaporetto.
          amagerStrand:
            name: Amager Strand
            note: Una lunga spiaggia urbana con laguna, dune e vista sui mulini dell'Øresund; ci si arriva comodamente in metro e si può davvero fare il bagno.
      modern:
        title: Architettura & curiosità
        items:
          superkilen:
            name: Superkilen
            note: Un parco a Nørrebro che probabilmente avete già visto in qualche pubblicità.
          copenhill:
            name: CopenHill (Amager Bakke)
            note: Un inceneritore con la pista da sci sopra. Si sale gratis con l'ascensore, ma è un po' fuori — niente di speciale.
          kaktusTowers:
            name: Kaktus Towers
            note: Due torri appuntite di BIG con piani ruotati, appartamenti in affitto e un parco pubblico rialzato sopra la città.
            kicker: 80 metri · BIG
            story: >-
              Ogni piano ruota rispetto a quello sotto, creando i balconi a punta
              che danno alle torri il soprannome di cactus. Sono soprattutto
              appartamenti compatti in affitto con spazi comuni; la parte più
              interessante per chi passa è il percorso verde pubblico alla base,
              collegato al tetto di IKEA e alla nuova zona dietro la stazione.
            url: https://dac.dk/en/magazine/places/kaktus-towers-prickly-architecture-231
          lynetteholm:
            name: Lynetteholm—il progetto completo
            note: Una penisola artificiale di 275 ettari tra Refshaleøen e Nordhavn; insieme barriera contro le mareggiate, riuso di terra da cantiere e futuro quartiere.
            kicker: 2022 → circa 2070
            story: >-
              Il perimetro di pietra lungo sette chilometri è stato completato nel
              2026. Ora l'interno verrà riempito con terra in eccesso proveniente
              dai cantieri di Copenaghen, un processo previsto fino al 2050 circa.
              La nuova costa contribuirà a proteggere la città dalle mareggiate
              da nord. Un accordo politico del 2025 prevede quasi 50.000 abitanti
              e 30.000 posti di lavoro a Lynetteholm, serviti in futuro dalla
              metro M5 e da una tangenziale orientale. Quartiere e infrastrutture
              richiedono ancora pianificazione, valutazioni ambientali e leggi
              separate: per questo “Lynetteholm” può indicare la penisola, la
              barriera climatica, il deposito di terra o l'intero piano urbano.
            url: https://byoghavn.dk/lynetteholm/
          nyboder:
            name: Nyboder
            note: Le lunghe case gialle costruite per la Marina da Christian IV; molte sono ancora abitazioni in affitto della Difesa.
            kicker: Dal 1631 · case della Marina
            story: >-
              Nyboder significa più o meno “nuove piccole case”. Christian IV le
              fece costruire per marinai, artigiani e sottufficiali della flotta,
              creando un quartiere di servizio nel centro della città. Non sono
              un semplice fondale da cartolina: la Difesa danese gestisce ancora
              circa seicento abitazioni in affitto qui, riservate soprattutto al
              proprio personale.
            url: https://www.ejendomsstyrelsen.dk/da/arbejdsomraader/salg-og-leje/forsvarets-lejeboliger/
          grundtvigChurch:
            name: Grundtvigs Kirke
            note: Una cattedrale espressionista di mattoni gialli a Bispebjerg, con una facciata che sembra contemporaneamente un organo e una scogliera.
            kicker: Sei milioni di mattoni · 1940
            story: >-
              Peder Vilhelm Jensen-Klint fuse la scala gotica delle cattedrali con
              le forme semplici delle chiese rurali danesi; dopo la sua morte il
              figlio Kaare completò l'edificio e ne disegnò anche le sedie. Online
              viene spesso chiamata “la chiesa di Shrek” per la somiglianza con la
              chiesa del matrimonio di Fiona e Lord Farquaad, ma DreamWorks non
              ha mai confermato che sia stata davvero il modello.
            url: https://www.visitcopenhagen.com/copenhagen/planning/grundtvigs-church-gdk410661
      shops:
        title: Negozi che valgono una sosta
        items:
          legoStore:
            name: LEGO Store Copenaghen
            note: Due piani su Vimmelskaftet, in mezzo allo Strøget. Il muro per costruire la minifigure, i grandi modelli della città e i mattoncini a peso.
            kicker: Danese dal 1932
            story: >-
              La LEGO nasce a Billund, nello Jutland, dove Ole Kirk Kristiansen
              iniziò a fare giocattoli di legno nel 1932; il nome viene da "leg
              godt", giocare bene. Il mattoncino a incastro come lo conosciamo
              è stato brevettato nel 1958. Il negozio di Copenaghen è la tappa
              comoda in città; l'esperienza completa è la LEGO House a Billund.
            url: https://www.lego.com/en-dk/stores/store/copenhagen
          illumBolighus:
            name: Illums Bolighus
            note: Il posto per il design danese, dal souvenir utile ai mobili che non potete portare in valigia.
            url: https://www.illumsbolighus.com/
          royalCopenhagen:
            name: Royal Copenhagen
            note: Porcellana bianca e blu, molto danese e molto bella. Per gli affari seri c'è anche l'outlet.
            url: https://www.royalcopenhagen.com/en-int/
  funfacts:
    emoji: 🇩🇰
    title: Cose molto danesi
    blurb: Quelle cose che fanno fermare i visitatori e chiedere “aspetta, perché?”
    groups:
      denmark:
        title: Piccole spiegazioni per grandi abitudini danesi
        items:
          hygge:
            name: Hygge, senza candele obbligatorie
            note: Stare bene insieme, senza fretta e senza dover trasformare tutto in un evento. Può essere una cena, un picnic o un caffè sotto la pioggia.
            kicker: Si pronuncia più o meno “hü-ga”
            story: >-
              Hygge viene spesso tradotto con “intimità” o “comodità”, ma conta
              soprattutto la sensazione: tempo tranquillo, atmosfera informale e
              persone con cui si sta bene. Non richiede decorazioni beige e non è
              soltanto invernale; anche un barbecue, un giro in bici o un bagno
              al porto possono essere hyggelige. La parola arrivò dal norvegese
              e compare nel danese scritto dalla fine del Settecento.
            url: https://www.visitdenmark.com/denmark/things-to-do/traditions-lifestyle/hygge
          danishBrands:
            name: Brand danesi da riconoscere
            note: "Non è solo LEGO e non sono solo mobili: una piccola lista di nomi danesi che incontrerete nei negozi, nelle case e molto oltre."
            kicker: Design · moda · industria
            storyItems:
              - "Mobili e oggetti: HAY, Muuto, Normann Copenhagen, &Tradition, Georg Jensen e Kay Bojesen."
              - "Moda e accessori: GANNI, Samsøe Samsøe, Rains, Wood Wood e Mads Nørgaard."
              - "Royal Copenhagen: la classica porcellana bianca e blu."
              - "Bang & Olufsen: il lato audio del design danese."
              - "Energia: Vestas per le turbine eoliche e Ørsted per l'energia rinnovabile."
              - "Farmaceutica: Novo Nordisk, una delle aziende danesi più grandi e conosciute al mondo."
              - "Trasporti e logistica: Mærsk, il gigante danese dei container."
              - "Gioielli e scarpe: Pandora ed ECCO."
              - "Illums Bolighus: il posto più semplice per vedere molti di questi nomi insieme."
          famousDanes:
            name: Danesi che forse conoscete già
            note: Scrittori, scienziati, designer, attori e sportivi di cui è facile non conoscere il legame con la Danimarca.
            kicker: Una lista molto incompleta
            storyItems:
              - "Storie e idee: H.C. Andersen, Søren Kierkegaard e Karen Blixen, che scriveva anche come Isak Dinesen."
              - "Scienza: l'astronomo Tycho Brahe e i fisici Niels Bohr e Lene Hau."
              - "Design e architettura: Arne Jacobsen, Verner Panton, Jørn Utzon e Bjarke Ingels."
              - "Sullo schermo: Mads Mikkelsen, Connie Nielsen, Nikolaj Coster-Waldau, Sidse Babett Knudsen e Lars Mikkelsen."
              - "Dietro la cinepresa: Carl Th. Dreyer, Susanne Bier, Lars von Trier, Thomas Vinterberg e Nicolas Winding Refn."
              - "Musica e sport: Lars Ulrich, MØ, Lukas Graham, Caroline Wozniacki, Christian Eriksen, Viktor Axelsen e Jonas Vingegaard."
          danishOnScreen:
            name: La Danimarca sullo schermo
            note: Su Netflix iniziate da Borgen – Potere e gloria, L'uomo delle castagne e The Rain; poi esplorate il noir nordico e il cinema danese.
            kicker: Politica · crime · Dogma 95
            storyItems:
              - "Serie: Borgen per la politica, The Killing e L'uomo delle castagne per il noir di Copenaghen, The Bridge per un omicidio danese-svedese esattamente sul confine."
              - "Più leggere o strane: Rita è una commedia drammatica scolastica tagliente; The Rain trasforma la Scandinavia in un thriller post-apocalittico."
              - "Film: Un altro giro, Il sospetto, Royal Affair, Il pranzo di Babette e Pelle alla conquista del mondo sono ottimi punti di partenza."
              - "Per vedere la Copenaghen contemporanea, A Copenhagen Love Story su Netflix resta vicino alla città quotidiana."
              - "I cataloghi streaming cambiano da Paese a Paese e nel tempo: cercate sempre il titolo invece di dare per scontata la disponibilità."
            url: https://www.netflix.com/title/81282868
          studentTrucks:
            name: I rumorosissimi camion dei diplomati
            note: A fine giugno ogni classe gira per le case di tutti gli studenti su un camion aperto decorato—cappelli bianchi, musica e volume senza moderazione.
            kicker: Studenterkørsel · fine giugno
            story: >-
              Il cappello bianco segna la fine delle superiori. Poi tutta la
              classe sale su un camion decorato e passa la giornata fermandosi a
              casa di ogni compagno per mangiare, bere e fare una festa molto
              breve. E sì, la storia dei “più bravi” che corrono è vera, ma va
              precisata: secondo un'usanza recente e informale, chi prende 12—il
              voto massimo—all'ultimo esame corre dietro al camion tra due tappe.
              Cambia da classe a classe e non è una regola nazionale; riguarda
              quel singolo esame, non gli studenti migliori in assoluto.
            url: https://odensekatedralskole.dk/drop-karakteren-i-huen/
          danishRealm:
            name: La Danimarca è più grande della Danimarca
            note: Il Paese sulla carta d'Europa è una delle tre parti del Regno di Danimarca, insieme a Groenlandia e Isole Faroe.
            kicker: Rigsfællesskabet · tre parti
            story: >-
              Groenlandia e Isole Faroe sono parti distinte e autonome del Regno,
              con parlamenti e governi eletti propri. L'autonomia faroese iniziò
              nel 1948 e quella groenlandese nel 1979; gli accordi del 2005 e 2009
              ne ampliarono i poteri. Lo Stato danese gestisce ancora varie
              questioni comuni, soprattutto gran parte della politica estera,
              della sicurezza e della difesa, con un coinvolgimento crescente di
              Faroe e Groenlandia. La Groenlandia fu formalmente colonia danese
              fino al 1953, e il rapporto—compresa una possibile indipendenza
              futura—è politica viva, non una semplice curiosità costituzionale.
            url: https://um.dk/en/foreign-policy/the-arctic/greenland-and-the-faroe-islands
          skane:
            name: Sì, la Skåne era danese
            note: Skåne, Halland e Blekinge furono province danesi orientali fino alla cessione alla Svezia con il Trattato di Roskilde del 1658.
            kicker: Oltre l'Øresund · fino al 1658
            story: >-
              Nel Medioevo Lund era uno dei centri religiosi più importanti del
              regno danese, e per Copenaghen l'Øresund era una via d'acqua interna,
              non un confine internazionale. Dopo le guerre del Seicento, la
              Svezia integrò le ex province danesi. Anche Bornholm e la regione di
              Trondheim furono cedute nel 1658, ma tornarono nel 1660; Skåne,
              Halland e Blekinge restarono svedesi. Oggi la Skåne è senza ambiguità
              svedese, ma questa storia spiega perché una gita a Lund sembri ancora
              collegata al racconto danese.
            url: https://natmus.dk/historisk-viden/danmark/enevaelde-1660-1849/den-enevaeldige-stat/det-danske-rige-under-enevaelden/
          oresundLink:
            name: Il ponte che diventa un tunnel
            note: Il collegamento con la Svezia non è metà ponte e metà sott'acqua—sono 8 km di ponte, un'isola artificiale di 4 km e un tunnel di 4 km.
            kicker: Collegamento Øresund · 15,9 km
            story: >-
              Arrivando dalla Svezia si percorre il ponte, si atterra sull'isola
              artificiale di Peberholm e poi si scompare nel tunnel Drogden prima
              dell'aeroporto di Copenaghen. Il tunnel lascia libera la rotta degli
              aerei e il canale di navigazione.
            url: https://www.oresundsbron.com/en/about-oresundsbron/about-us/facts-about-oresundsbron
          danishLanguage:
            name: Il danese è davvero difficile da sentire
            note: Ha un numero insolito di suoni simili a vocali e i confini tra le parole sfumano; perfino i bambini danesi devono lavorare di più.
            kicker: Troppe vocali, a quanto pare
            story: >-
              Le ricerche dell'Università di Aarhus collegano consonanti ridotte
              e molti suoni vocalici a un'elaborazione linguistica iniziale più
              lenta. In un confronto, a 15 mesi i bambini danesi conoscevano circa
              il 30% di parole in meno dei bambini norvegesi e impiegavano quasi
              due anni in più per padroneggiare il passato. Non è solo una scusa
              inventata dagli stranieri.
            url: https://projects.au.dk/the-puzzle-of-danish/about-the-project
          cyclingComeback:
            name: Copenaghen non è sempre stata la città delle bici
            note: Negli anni Sessanta le auto stavano sostituendo le bici. Crisi petrolifera del 1973, domeniche senza auto, proteste e decenni di piste sicure le hanno riportate.
            kicker: Un ritorno, non un miracolo
            story: >-
              Negli anni Venti e Trenta la bici era già un mezzo di massa, ma il
              benessere del dopoguerra spinse Copenaghen verso l'auto. La crisi
              petrolifera rese fragile quel modello; proteste ambientaliste e
              pressione pubblica chiesero poi spazio per le biciclette.
              Investimenti continui in percorsi protetti hanno reso la bici la
              scelta quotidiana più facile: non basta dire che la Danimarca è piatta.
            url: https://denmark.dk/people-and-culture/biking
          frozenLakes:
            name: Quando Søerne diventa una piazza
            note: In un inverno davvero freddo, una parte sicura dei laghi si riempie di persone e pattinatori. Aspettate i cartelli blu del Comune.
            kicker: Raro, freddo e molto Copenaghen
            url: https://www.instagram.com/reel/DVHRB9PiILm/
            linkText: Guarda il reel
  food:
    emoji: 😋
    title: Cosa mangiare
    blurb: La cucina danese non è memorabile, ma gli smørrebrød valgono la pena.
    groups:
      markets:
        title: Mercati
        items:
          torvehallerne:
            name: Torvehallerne
            note: Due padiglioni coperti pieni di banchi, prodotti freschi e piccoli pasti; un posto semplice per assaggiare smørrebrød senza prenotare.
          reffen:
            name: Reffen
            note: Street food in vecchi container sul lato industriale del porto, con tavoli all'aperto, laboratori e molto spazio; controllate l'apertura stagionale.
          broens:
            name: Broens Gadekøkken
            note: Cucine di strada, appena dall'altra parte di Nyhavn. All'aperto.
          kodbyen:
            name: Kødbyen
            note: Il Meatpacking District — bar e ristoranti nelle vecchie macellerie.
          tivoliFoodHall:
            name: Tivoli Food Hall
            note: Una tappa facile e centrale, accanto alla stazione. Si entra dalla strada senza biglietto per Tivoli.
            url: https://www.tivoli.dk/en/food-and-drinks/tivoli-food-hall
      dining:
        title: Ristoranti
        items:
          detLilleApotek:
            name: Det Lille Apotek
            note: Uno dei ristoranti più antichi della città, con stanze basse, candele e cucina danese tradizionale senza reinterpretazioni creative.
          aamanns:
            name: Aamanns 1921
            note: Smørrebrød moderni e molto curati in un vero ristorante, non uno snack veloce; eccellenti, ma guardate i prezzi prima di ordinare.
          gasolineGrill:
            name: Gasoline Grill
            note: Un'istituzione per gli hamburger a Copenaghen, con molta fama internazionale. Andateci se vi va un burger molto buono e un po' di coda.
            url: https://gasolinegrill.com/
      coffee:
        title: Caffè con un motivo per fermarsi
        items:
          originalCoffeeIllum:
            name: Original Coffee, ILLUM Rooftop
            note: Specialty coffee in cima a ILLUM; il vero motivo per salire è bere guardando Strøget e i tetti del centro dall'alto.
            kicker: Vista gratuita · sopra Strøget
            url: https://originalcoffee.dk/en/pages/illum-rooftop
          mirabelle:
            name: Mirabelle / Lazy Bakery
            note: Pane a lievitazione naturale, dolci che cambiano ogni giorno e un vero espresso al banco, pubblicizzato ancora a 10 kr.
            kicker: Nørrebro · espresso al banco
            story: >-
              La parte bakery di Mirabelle porta a Copenaghen una piccola
              abitudine italiana: espresso rapido, bevuto in piedi al banco e a
              un prezzo insolitamente gentile per la città. Il sito lo indica
              attualmente a dieci corone; essendo un prezzo, controllate che sia
              ancora valido quando andate. Il pane e i dolci cambiano ogni giorno.
            url: https://www.mirabelle-spiseria.dk/lazy-bakery
  pastries:
    emoji: 🍰
    title: Pasticceria
    blurb: Cardamomo, burro e un'ottima ragione per alzarsi presto.
    groups:
      bakeries:
        title: Pasticcerie
        items:
          andersen:
            name: Andersen
            note: Panificio a Islands Brygge con pane, croissant e dolci molto precisi; una buona deviazione da abbinare a una passeggiata sul porto.
          juno:
            name: Juno
            note: Il cardamom bun più famoso della città, in una piccola panetteria di Østerbro. Andate presto e mettete in conto un po' di fila.
          lagkagehuset:
            name: Lagkagehuset
            note: "È una catena e si trova ovunque: meno speciale delle bakery indipendenti, ma affidabile per pane, dolci e colazione senza deviazioni."
          alice:
            name: Alice, Amager
            note: Pasticceria fatta bene, caffè e gelato stagionale. Se c'è, provate il gelato al cardamomo.
            url: https://maps.app.goo.gl/932ZVTmvULBaKjFJ7
          kongHansBakery:
            name: Kong Hans Bakery
            note: Dal team del bistellato Kong Hans Kælder, una bakery ancora abbastanza sotto il radar con lievitati, pane e pâtisserie trattati con precisione da alta cucina.
            kicker: Østerbro · aperta nel 2025
            story: >-
              Kælder significa “cantina” ed è il nome dello storico ristorante da
              cui nasce il progetto; la bakery è invece un locale separato in
              Øster Farimagsgade. Porta fuori dal ristorante la stessa idea di
              precisione, unendo tecnica francese, disciplina nordica, pane a
              lunga fermentazione, croissant e pasticceria. Il posto è piccolo e
              relativamente nuovo: aspettatevi facilmente un po' di fila.
            url: https://konghansbakery.dk/en/
          morePastries:
            name: Altri consigli dolci
            note: Una lista utile trovata su Instagram — non è mia, ma salvatela.
            url: https://www.instagram.com/p/DOSrrF8DJpF/
  museums:
    emoji: 🏺
    title: Musei
    blurb: Piove? Perfetto, piove quasi sempre.
    groups:
      art:
        title: Arte & storia
        items:
          smk:
            name: SMK
            note: "La Galleria Nazionale: arte danese, grandi maestri europei e un'ala moderna affacciata sul parco di Østre Anlæg."
          nationalmuseet:
            name: Nationalmuseet
            note: Il modo più completo per seguire la storia danese dalla preistoria ai Vichinghi e alla vita quotidiana più recente.
          thorvaldsens:
            name: Thorvaldsens Museum
            note: Sculture neoclassiche dentro sale dai soffitti dipinti e colori inaspettati; piccolo abbastanza da non sacrificargli l'intera giornata.
          glyptotek:
            name: Ny Carlsberg Glyptotek
            note: Antichità egizie, greche e romane, pittura francese e un giardino d'inverno pieno di palme che vale già la visita.
          designmuseum:
            name: Designmuseum Danmark
            note: L'introduzione più chiara al design danese—mobili, artigianato, moda e grafica—nell'ex Ospedale Reale Frederik.
            url: https://designmuseum.dk/en/
          copenhagenContemporary:
            name: Copenhagen Contemporary
            note: Installazioni monumentali, performance e videoarte in 7.000 m² degli ex capannoni di saldatura B&W a Refshaleøen.
            url: https://copenhagencontemporary.org/en/
          cisternerne:
            name: Cisternerne
            note: Installazioni artistiche in vecchie cisterne sotterranee.
          experimentarium:
            name: Experimentarium
            note: Tre piani di esperimenti da toccare, giochi sull'acqua e terrazza sul tetto; ottimo con bambini e giornate di pioggia lunghe.
          louisiana:
            name: Louisiana Museum of Modern Art
            note: Fuori città, circa un'ora di treno. Vale l'intera giornata.
          arken:
            name: ARKEN Museum of Contemporary Art
            note: Arte contemporanea in un edificio a forma di nave accanto al parco costiero di Ishøj; abbinate gallerie e parco di sculture a una passeggiata sul mare.
            travel: 16 min di S-train + bus o camminata
            url: https://www.arken.dk/en
          museumGuide:
            name: I musei top di Copenaghen
            note: La selezione ufficiale per confrontare collezioni, quartieri e idee meno ovvie quando volete scegliere un solo museo.
            url: https://www.visitcopenhagen.com/copenhagen/activities/copenhagens-top-museums
  saunas:
    emoji: 🧖
    title: Saune & bagni termali
    blurb: "Stanza calda, porto freddo o terme a lume di candela: scegliete voi."
    groups:
      sweat:
        title: Dove sudare o immergersi
        items:
          aire:
            name: AIRE Ancient Baths
            note: Un lussuoso percorso termale a lume di candela con bagno turco e massaggi nelle cantine storiche del vecchio birrificio Carlsberg—bellissimo, silenzioso e con prezzi adeguati.
            kicker: Carlsberg Byen · prenotate
            url: https://relax.beaire.com/en/aire-ancient-baths-copenhagen
          glaecier:
            name: Glaecier
            note: Club galleggiante a Refshaleøen con sauna, piscina di acqua portuale filtrata e vista panoramica; normalmente richiede membership, salvo gli Open Gus.
            url: https://glaecier.com/en/
          sauna85:
            name: Sauna85
            note: "Saunagus prenotabile senza membership in più sedi: una buona introduzione se volete provare calore, oli essenziali e immersione fredda."
            url: https://www.sauna85.dk/en/
          pluginHeat:
            name: Plugin Heat Club
            note: Sessioni guidate da 75 minuti che alternano tre giri di sauna e freddo, con sedi ad Amager e Sydhavn.
            url: https://www.pluginheatclub.com/
          platform:
            name: Platform CPH
            note: Sauna urbana vicino a BLOX e al porto, comoda se volete aggiungere un gus a una giornata nel centro.
            url: https://www.platformcph.com/
          kynd:
            name: KYND Sauna
            note: Saunagus, affitto privato e sedi molto diverse; quella a Kalvebod Brygge ha vista panoramica sul porto e accesso diretto all'acqua.
            kicker: Ex Mobilsauna · più sedi
            url: https://kynd.dk/
  boats:
    emoji: ⛵
    title: Barche
    blurb: Copenaghen ha più senso vista dall'acqua. Decidete chi guida.
    groups:
      sail:
        title: Scegliete la barca
        items:
          goboat:
            name: GoBoat
            note: Barca elettrica silenziosa da picnic da guidare da soli. Portate gli snack e prendetevela con calma sul porto.
            kicker: Si guida da soli · Patente non necessaria
            url: https://goboat.dk/en/copenhagen
          friendships:
            name: FriendShips
            note: Un'altra barca elettrica da picnic da guidare da soli, in pieno centro. Si può portare cibo e da bere.
            kicker: Si guida da soli · Fino a 8 persone
            url: https://www.friendships.dk/
          heyCaptain:
            name: Hey Captain
            note: Piccolo tour sociale nei canali con capitano, invece della grande barca turistica.
            kicker: Con guida · Pubblico o privato
            url: https://www.heycaptain.dk/
          duffyBoats:
            name: Duffy Boats
            note: Barca elettrica comoda con capitano — l'opzione rilassata se nessuno vuole guidare.
            kicker: Con capitano · Portate un picnic
            url: https://duffyboats.dk/
  beyond:
    emoji: 🚆
    title: Fuori Copenaghen
    blurb: Il resto della Danimarca è piccolo, piatto e molto comodo in treno.
    groups:
      daytrips:
        title: Gite in giornata (meno di ~1h di treno)
        items:
          frederiksborg:
            name: Castello di Frederiksborg, Hillerød
            note: Un castello rinascimentale su tre isolotti, con giardini barocchi dietro. Il più bello di tutti.
            travel: 40 min da Nørreport
            kicker: Christian IV · '600
            story: >-
              Christian IV ricostruì Frederiksborg all'inizio del Seicento come
              il suo castello di rappresentanza. Dopo l'incendio del 1859 fu il
              birraio J.C. Jacobsen a pagarne il restauro, e riaprì come Museo
              di Storia Nazionale. Il giardino barocco a terrazze dietro il
              castello si visita gratis.
            url: https://dnm.dk/en/
          kronborg:
            name: Castello di Kronborg, Helsingør
            note: Il castello di Amleto, nel punto più stretto dell'Øresund. La Svezia è lì davanti.
            travel: 45 min da Copenhagen H
            kicker: UNESCO · Amleto
            story: >-
              Kronborg controllava lo Stretto e il pedaggio che ogni nave doveva
              pagare, e questo rese ricca la corona danese. Shakespeare lo
              trasformò in Elsinore nell'Amleto senza averlo mai visto. Sotto il
              castello dorme Holger Danske, che secondo la leggenda si sveglierà
              quando la Danimarca ne avrà bisogno.
            url: https://kongeligeslotte.dk/en/palaces-and-gardens/kronborg-castle.html
          roskilde:
            name: Roskilde
            note: La cattedrale reale più cinque navi vichinghe recuperate dal fiordo — e si può navigare su una ricostruzione.
            travel: 25 min di treno
            kicker: Cattedrale + navi vichinghe
            story: >-
              Roskilde era la capitale della Danimarca nel Medioevo, e la sua
              cattedrale di mattoni è la chiesa sepolcrale di re e regine
              danesi. Giù al fiordo, cinque navi furono affondate di proposito
              intorno al 1070 per bloccare il canale; scavate nel 1962, ora
              stanno nel Museo delle Navi Vichinghe.
            url: https://www.vikingeskibsmuseet.dk/en
          louisianaTrip:
            name: Louisiana, Humlebæk
            note: Arte moderna, vista sul mare e un parco di sculture. Mezza giornata minimo.
            travel: 35 min di treno + breve camminata
          dyrehaven:
            name: Dyrehaven
            note: Una riserva reale piena di cervi, sentieri e querce secolari appena oltre Bellevue; natura vera raggiungibile in S-train.
            travel: ~20 min fino a Klampenborg
            kicker: UNESCO · cervi in libertà
            story: >-
              L'ex terreno di caccia reale conserva lunghi viali a stella creati
              per la caccia par force, oggi parte del patrimonio UNESCO della
              Zelanda del Nord. Cervi rossi, daini e sika si muovono liberamente:
              osservateli da lontano e non date loro da mangiare. Si combina
              facilmente con Bellevue o con Bakken, il parco divertimenti nel bosco.
            url: https://www.visitcopenhagen.com/copenhagen/planning/deer-park-gdk414367
          malmo:
            name: Malmö, Svezia
            note: Treno attraverso il ponte dell'Øresund. Un altro Paese prima di pranzo — portate documento o passaporto.
            travel: 35 min da Copenhagen H
          lund:
            name: Lund, Svezia
            note: Città universitaria compatta con cattedrale romanica, case basse e strade acciottolate; più tranquilla di Malmö e perfetta per una giornata lenta.
            travel: ~55 min di treno diretto
            kicker: Università dal 1666 · Skåne
            story: >-
              Lund fu un importante centro religioso danese prima che la Scania
              diventasse svedese nel Seicento. La cattedrale conserva una cripta
              dell'XI secolo e un orologio astronomico; attorno, l'università e
              Kulturen riempiono il centro di cortili, musei e studenti. Portate
              comunque un documento valido: state attraversando un confine.
            url: https://visitlund.se/en
          skybarMalmo:
            name: Skybar, Malmö Live
            note: Una tappa a Malmö per mangiare o bere con una vista grande sulla città.
            url: https://maps.app.goo.gl/EyKtERFBjXYHZ5pc8
          bullenMalmo:
            name: Bullen – Två Krögare
            note: "Una sala storica e cucina svedese classica senza troppi fronzoli: polpette, aringhe e piatti robusti nel centro di Malmö."
            url: https://maps.app.goo.gl/TJjq7w8dQaPwn2JC7
      longer:
        title: Vale il viaggio più lungo
        items:
          monsKlint:
            name: Møns Klint
            note: Scogliere bianche di gesso che cadono per 120 m su acqua turchese, con una faggeta sopra. Il paesaggio più inaspettato della Danimarca.
            travel: ~2h in auto, di più in bus
            kicker: 70 milioni di anni
            story: >-
              Le scogliere sono gesso formato dai gusci di innumerevoli
              creature marine, spinto in superficie dall'era glaciale. Sulla
              spiaggia sotto emergono fossili — cercate belemniti e ricci di
              mare. Møn è anche riserva Dark Sky: il cielo notturno è
              spettacolare.
            url: https://www.moensklint.dk/en/
          stevnsKlint:
            name: Stevns Klint
            note: Lo stesso gesso, più vicino alla città, con una linea patrimonio UNESCO che segna il giorno in cui si estinsero i dinosauri.
            travel: ~1h 15 in auto
            kicker: UNESCO · il limite K-Pg
            story: >-
              Nella parete corre un sottile strato scuro di "argilla dei pesci":
              i detriti dell'asteroide che 66 milioni di anni fa chiuse l'era
              dei dinosauri. Sopra, la chiesa di Højerup perse il coro nel mare
              nel 1928.
            url: https://www.stevnsklint.dk/en/
          odense:
            name: Odense
            note: La città di H.C. Andersen, con un museo costruito attorno alla casa dove è nato.
            travel: 1h 15 di treno
            kicker: Fiabe · Fionia
            story: >-
              Andersen crebbe povero a Odense e partì per Copenaghen a
              quattordici anni. La nuova H.C. Andersen's House di Kengo Kuma è
              mezza interrata e costruita come una fiaba più che come una
              biografia. Il quartiere antico attorno è tra i più belli di
              Danimarca.
            url: https://hcandersenshus.dk/en
          bornholm:
            name: Bornholm
            note: "L'isola baltica danese: pesce affumicato, scogliere, spiagge e un vero weekend lento."
            travel: Traghetto o volo breve da Copenaghen · dormite lì
            kicker: Fuga su un'isola
            story: >-
              Bornholm sembra diversa dal resto della Danimarca: scogliere di
              granito e chiese rotonde a nord, grandi spiagge a sud e affumicatoi
              ovunque. È troppo per una gita in giornata: fateci un weekend,
              con traghetto o volo da Copenaghen, poi bus dell'isola o bici per
              girarla senza fretta.
            url: https://visit-bornholm.com/en/plan-your-trip-to-bornholm
          tisvildeleje:
            name: Tisvildeleje
            note: "Una rilassata cittadina di mare sulla costa nord: sabbia, casette da spiaggia colorate e la foresta di Tisvilde Hegn dietro."
            travel: ~1h 20 di treno
            url: https://www.visitnorthzealand.com/north-zealand/cities/tisvildeleje-historic-seaside-resort-and-young-culture
          gilleleje:
            name: Gilleleje
            note: Porto di pesca ancora vivo, pesce, viuzze antiche e una bella spiaggia sulla riviera danese.
            travel: ~1h 15 di treno
            url: https://www.visitnorthzealand.com/north-zealand/cities/gilleleje-the-fishing-town-at-the-top-of-north-zealand
          campAdventure:
            name: Camp Adventure
            note: Forest Tower e un enorme parco avventura nel sud della Zelanda — bella giornata all'aperto se avete l'auto.
            travel: ~1h 15 in auto
            url: https://www.campadventure.dk/
      jutland:
        title: Jutland & oltre
        items:
          legoHouse:
            name: LEGO House, Billund
            note: "L'originale: 25 milioni di mattoncini, sei zone di costruzione e Legoland accanto."
            travel: ~3h tra treno e bus
            kicker: La casa del mattoncino
            story: >-
              La LEGO House sta a Billund, dove l'azienda è nata, ed è a forma
              di 21 mattoncini impilati. È fatta per costruire, non per
              guardare: dentro si tocca tutto. Legoland è a due passi se avete
              bambini.
            url: https://legohouse.com/en-gb/
          aarhus:
            name: Aarhus
            note: "La seconda città danese: compatta, giovane e abbastanza ricca di musei, cibo e architettura da meritare almeno una notte."
            travel: 3h di treno
            url: https://www.visitaarhus.com/
          aros:
            name: ARoS Aarhus Art Museum
            note: Un grande museo d'arte contemporanea il cui arcobaleno sul tetto trasforma tutta la vista della città in parte dell'opera.
            kicker: Your rainbow panorama · Olafur Eliasson
            story: >-
              L'opera più famosa del museo è Your rainbow panorama: un percorso
              circolare di vetro lungo 150 metri in tutti i colori dello spettro,
              installato sul tetto nel 2011 dall'artista danese-islandese Olafur
              Eliasson. Percorretelo lentamente per vedere Aarhus cambiare colore,
              poi lasciate tempo alla collezione e alle grandi installazioni ai
              piani inferiori: è molto più di un belvedere con un museo sotto.
            url: https://www.aros.dk/en/
          denGamleBy:
            name: Den Gamle By, Aarhus
            note: Un museo all'aperto della vita urbana danese, costruito con 80 case storiche trasferite qui da città di tutto il Paese.
            kicker: Strade attraverso diversi secoli
            story: >-
              Non è la ricostruzione di un solo villaggio medievale. Si passa tra
              case, botteghe, officine e giardini dal Seicento in avanti, con
              quartieri particolarmente riusciti dedicati al 1864, 1927 e 1974.
              Dalla primavera all'inverno, abitanti in costume e artigiani al
              lavoro trasformano gli edifici in storia vissuta, non in una fila
              di semplici facciate.
            url: https://www.dengamleby.dk/en/
          moesgaard:
            name: Moesgaard
            note: Un magnifico museo di archeologia e antropologia a sud di Aarhus, con gallerie immersive e il corpo di torbiera meglio conservato al mondo.
            travel: Aarhus + ~25 min di bus
            kicker: Uomo di Grauballe · tetto percorribile
            story: >-
              L'Uomo di Grauballe morì attorno al 390 a.C. e conserva ancora
              pelle, capelli, unghie e lineamenti dopo più di duemila anni nella
              torba. È il fulcro di una suggestiva mostra sull'Età del Ferro, ma
              Moesgaard spazia dalla preistoria e dai Vichinghi all'antropologia.
              Anche l'edificio di Henning Larsen fa parte della visita: il grande
              tetto inclinato è aperto a tutti e guarda verso la baia di Aarhus,
              i boschi e i campi circostanti.
            url: https://moesgaardmuseum.dk/en/
          mennesketVedHavet:
            name: Mennesket ved Havet (L'uomo incontra il mare)
            note: Quattro figure bianche monumentali siedono davanti al Mare del Nord sulla spiaggia di Sædding, circa quattro chilometri dal centro di Esbjerg.
            travel: ~3h di treno + bus locale
            kicker: Esbjerg · Svend Wiig Hansen · 1995
            story: >-
              Svend Wiig Hansen disegnò le figure alte nove metri in forme
              volutamente semplici e senza tempo, con gambe allungate come colonne
              di un tempio greco. Furono inaugurate nel 1995 per il centenario di
              Esbjerg come comune indipendente e diventarono presto il simbolo
              della città. I volti impassibili guardano l'ingresso del porto; con
              il cielo limpido, i quattro corpi si vedono da dieci chilometri.
            url: https://www.visitdenmark.dk/danmark/explore/mennesket-ved-havet-kaempeskulptur-i-esbjerg-gdk1076855
          fano:
            name: Fanø
            note: Grandi spiagge sul Mare del Nord, dune, foche, antichi paesi marinari e vento per surf, aquiloni e vela sulla sabbia—a pochi minuti di traghetto da Esbjerg.
            travel: ~3h fino a Esbjerg + 12 min di traghetto
            kicker: Mare dei Wadden · non Cold Hawaii
            story: >-
              Fanø è davvero adatta al surf ed eccezionale per aquiloni, kite buggy
              e blokart sulla sua enorme spiaggia compatta. Ma di solito non è
              lei la “Hawaii della Danimarca”: Cold Hawaii è il nome dei 31 spot
              da surf sulla costa del Thy, più a nord, con centro a Klitmøller.
              L'identità di Fanø è invece il Mare dei Wadden patrimonio UNESCO,
              i banchi di foche, l'ambra, le viuzze marittime di Nordby e il paese
              ben conservato di Sønderho. Si combina naturalmente con Esbjerg e
              Mennesket ved Havet.
            url: https://visitfanoe.dk/en/
          aalborg:
            name: Aalborg
            note: Una città universitaria simpatica sul Limfjord, con lungofiume reinventato, Utzon Center e tanta street art.
            travel: ~4h di treno
            kicker: Jutland del Nord · città sul fiordo
            url: https://www.visitaalborg.com/
          skagen:
            name: Skagen & Grenen
            note: La punta estrema della Danimarca, dove due mari si incontrano e si può stare con un piede in ciascuno.
            travel: ~5h di treno
            kicker: Dove i mari si scontrano
            story: >-
              A Grenen lo Skagerrak e il Kattegat si incontrano di fronte, e
              dalla lingua di sabbia si vedono le onde scontrarsi. La luce
              chiara del nord attirò qui i Pittori di Skagen a fine Ottocento,
              e le loro case gialle danno ancora il tono al paese.
            url: https://www.visitdenmark.com/denmark/destinations/north-jutland/skagen
          rubjergKnude:
            name: Faro di Rubjerg Knude
            note: Un faro su una gigantesca duna in movimento. Nel 2019 è stato spostato su rotaie per non farlo cadere in mare.
            travel: ~5h tra treno e bus
          moreTrips:
            name: Organizzare le gite
            note: La raccolta ufficiale per confrontare castelli, costa, musei e tempi di viaggio quando volete uscire dalla città.
            url: https://www.visitcopenhagen.com/copenhagen/activities/day-trips-copenhagen
  inspiration:
    emoji: 👻
    title: Ispirazione
    blurb: Se per una volta volete il parere di qualcun altro.
    calendarTitle: Eventi durante l'anno
    groups:
      things:
        title: Cose che piacciono a me
        items:
          nyt:
            name: Things to do in Copenhagen
            note: La guida del New York Times per un secondo parere su quartieri, ristoranti e cose da fare. Curata e aggiornata separatamente da questa lista.
            url: https://www.nytimes.com/interactive/2023/07/20/travel/things-to-do-copenhagen.html
      february:
        title: Febbraio
        collapsible: true
        months: [2]
        items:
          lightFestival:
            name: Copenhagen Light Festival
            note: Serate buie e installazioni luminose in tutta la città. Guardate il programma e vestitevi pesanti.
            url: https://copenhagenlightfestival.org/
      april:
        title: Aprile
        collapsible: true
        months: [4]
        items:
          sakura:
            name: Sakura Festival
            note: Ciliegi in fiore, cibo giapponese e una folla enorme a Langelinie. Andate presto.
            url: https://sakurafestival.dk/
          cherryBlossoms:
            name: Passeggiate tra i ciliegi in fiore
            note: Fate Kastellet e Langelinie, poi il famoso tunnel rosa del cimitero di Bispebjerg. Anche le vie attorno a Bispebjerg sono molto belle.
            url: https://www.visitcopenhagen.com/copenhagen/this-is-copenhagen/seasons/places-to-see-copenhagen-in-its-spring-coat
      june:
        title: Giugno
        collapsible: true
        months: [6]
        items:
          distortion:
            name: Distortion
            note: La festa di strada più rumorosa di Copenaghen. Divertente, caotica e tranquillamente evitabile se non fa per voi.
            url: https://www.cphdistortion.dk/
          threeDays:
            name: 3daysofdesign
            note: Copenaghen diventa una gigantesca casa aperta del design. Molte mostre sono gratis—prenotate le più popolari.
            url: https://www.3daysofdesign.dk/
          sanktHans:
            name: Sankt Hans
            note: Falò di mezza estate sull'acqua, di solito il 23 giugno. Molto danese e un po' stregonesco.
            url: https://www.visitcopenhagen.com/copenhagen/activities/sankt-hans-eve-gdk415605
      july:
        title: Luglio
        collapsible: true
        months: [7]
        items:
          jazz:
            name: Copenhagen Jazz Festival
            note: Per dieci giorni la musica esce da club, parchi e cortili. Meglio girare senza pianificare troppo.
            url: https://jazz.dk/
      august:
        title: Agosto
        collapsible: true
        months: [8]
        items:
          pride:
            name: Copenhagen Pride
            note: Parata, concerti e tanta gente intorno a City Hall Square. Controllate il programma prima di andare.
            url: https://www.copenhagenpride.dk/en/
          operaFestival:
            name: Copenhagen Opera Festival
            note: Opera in posti inaspettati, anche con spettacoli gratuiti all'aperto sul porto.
            url: https://www.operafestival.dk/
      october:
        title: Ottobre
        collapsible: true
        months: [10]
        items:
          kulturnatten:
            name: Kulturnatten
            note: Un venerdì in cui musei, chiese e posti curiosi restano aperti fino a tardi. Serve il Culture Night Pass.
            url: https://www.kulturnatten.dk/da/Kulturnatten
      december:
        title: Dicembre
        collapsible: true
        months: [12]
        items:
          santaLucia:
            name: Sfilata di Santa Lucia in kayak
            note: Una processione galleggiante di luci nei canali. Arrivate presto per un posto buono sull'acqua.
            url: https://www.visitcopenhagen.com/copenhagen/planning/santa-lucia-parade-kayaks-gdk1106677
